<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Business Manager Pro</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#2c3e50;--primary:#0A5EB0;--primary-hover:#084c8d;--secondary:#6c757d;--success:#28a745;--danger:#dc3545;--border:#e2e8f0;--shadow:0 4px 12px rgba(0,0,0,.08)}
body.dark-theme{--bg:#121212;--card:#1e1e1e;--text:#f1f1f1;--border:#333;--shadow:0 4px 12px rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;line-height:1.5;transition:background .3s,color .3s}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;font-weight:500;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:1000;animation:fadeInUp .3s ease}
@keyframes fadeInUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.overdue-badge{background:var(--danger);color:#fff;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.splash-screen{position:fixed;inset:0;background:var(--primary);color:#fff;display:flex;justify-content:center;align-items:center;text-align:center;z-index:1000}
.app-icon{font-size:60px;margin-bottom:10px}
.login-screen{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;background:var(--bg);padding:20px}
.login-card{background:var(--card);padding:30px 20px;border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:350px;text-align:center}
.login-card input{width:100%;padding:12px;margin:15px 0;border:1px solid var(--border);border-radius:8px;font-size:18px;text-align:center;background:var(--bg);color:var(--text)}
.login-actions{display:flex;gap:10px}
.login-actions .btn-primary{width:auto;flex:2}
.login-actions .btn-secondary{flex:1}
.app-header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:var(--card);box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.icon-btn{background:transparent;border:none;font-size:20px;cursor:pointer;margin-left:10px;color:var(--text)}
.dashboard-container{padding:20px;max-width:800px;margin:0 auto}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:15px}
.menu-card{background:var(--card);padding:20px 10px;border-radius:14px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform .2s;display:flex;flex-direction:column;align-items:center;width:100%}
.menu-card:active{transform:scale(.96)}
.card-icon{font-size:36px;margin-bottom:8px}
.card-title{font-size:14px;font-weight:600}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;justify-content:center;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-card{background:var(--card);width:100%;max-width:650px;border-radius:20px 20px 0 0;padding:20px;max-height:85vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s}
.modal-overlay.active .modal-card{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:15px}
.close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text)}
.form-group{margin-bottom:12px;display:flex;flex-direction:column}
.form-group label{font-size:13px;margin-bottom:4px;font-weight:600}
input,select,textarea{padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
button{border:none;border-radius:8px;cursor:pointer;transition:opacity .2s}
button:active{opacity:.8}
.btn-primary{background:var(--primary);color:#fff;width:100%;padding:10px}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:var(--secondary);color:#fff}
.search-bar{width:100%;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(0,0,0,.03);font-weight:600}
.action-btns{display:flex;gap:4px}
.action-btns button{padding:6px 8px;font-size:12px}
.eth-date-picker{display:flex;gap:6px}
.eth-date-picker select{flex:1;min-width:0}
.summary-box{background:rgba(10,94,176,.08);border-left:4px solid var(--primary);padding:12px;border-radius:6px;margin-bottom:15px}
</style>
</head>
<body>

<div id="splashScreen" class="splash-screen">
  <div><div class="app-icon">📊</div><h1>ስማርት ቢዝነስ ማኔጀር</h1><p>በመጫን ላይ...</p><p style="font-size:11px;opacity:.7;margin-top:14px;">ስሪት v2026.10.12a</p></div>
</div>

<div id="activationScreen" class="login-screen hidden">
  <div class="login-card">
    <div class="app-icon">🔑</div>
    <h2 id="actTitle">የማንቃት ኮድ</h2>
    <div class="form-group">
      <label>የሱቁ ስም</label>
      <input type="text" id="actShop" placeholder="ለምሳሌ፡ አበባ ሱቅ">
    </div>
    <div class="form-group">
      <label>የፍቃድ ኮድ (License Key)</label>
      <input type="text" id="actCode" placeholder="ከሻጩ የተሰጠዎትን ኮድ ይለጥፉ">
    </div>
    <button class="btn-primary" onclick="SBM.app.tryActivate()">✔ አነቃቃ</button>
    <p style="font-size:12px;color:var(--secondary);margin-top:10px;">ፍቃድ ለማግኘት ሻጩን ያግኙ</p>
    <p style="font-size:11px;color:var(--secondary);opacity:.7;margin-top:8px;">ስሪት v2026.10.12a</p>
  </div>
</div>

<div id="loginScreen" class="login-screen hidden">
  <div class="login-card">
    <div class="app-icon">🔐</div>
    <h2>እንኳን ደህና መጡ</h2>
    <form onsubmit="SBM.app.handleLogin(); return false;">
      <div class="form-group">
        <label for="pinInput">እባክዎን ፒን (PIN) ያስገቡ</label>
        <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" maxlength="6">
      </div>
      <div class="login-actions">
        <button type="button" id="togglePinBtn" class="btn-secondary">ግልጽ</button>
        <button type="submit" class="btn-primary">ግባ</button>
      </div>
    </form>
    <button type="button" id="forgotBtn" class="btn-secondary" style="margin-top:10px;width:100%;" onclick="SBM.app.forgotPIN()">🔓 ፒን ረሳሁ</button>
    <p style="font-size:11px;color:var(--secondary);opacity:.7;margin-top:10px;text-align:center;">ስሪት v2026.10.12a</p>
  </div>
</div>

<div id="appShell" class="hidden">
  <header class="app-header">
    <h1 id="headerCompName">ስማርት ቢዝነስ</h1>
    <div>
      <button class="icon-btn" type="button" onclick="SBM.app.toggleTheme()">🌓</button>
      <button class="icon-btn" type="button" onclick="SBM.app.handleLogout()">🚪</button>
    </div>
  </header>
  <main class="dashboard-container">
    <section class="summary-box">
      <strong>አሁን ምን ምን አለ</strong>
      <p>ከታች ያሉትን ሜኖች በመጫን ስቶክ፣ ሽያጭ፣ ዱቤ፣ ወጪ እና ሪፖርት ይከታተሉ።</p>
    </section>
    <div id="menuGrid" class="menu-grid"></div>
  </main>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle">ርዕስ</h2>
      <button class="close-btn" type="button" onclick="SBM.app.closeModal()" aria-label="ዝጋ">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<!--
  የስክሪፕት አጫጫን ቅደም ተከተል አስፈላጊ ነው፦
  1) database.js  → SBM.DB / SBM.database ይፈጥራል
  2) app.js       → SBM.utils / SBM.app ይፈጥራል (ሌሎቹ ፋይሎች በዚህ ላይ ይመሰረታሉ)
  3) auth.js, activation.js → የደህንነት ሞጁሎች
  4) sync.js      → Firebase cloud backup
  5) stock/sales/credit/report/receipt/backup/settings → የቢዝነስ ገጽታዎች
-->
<!-- Firebase SDK እዚህ ሆን ብሎ አይጫንም። ኢንተርኔት ከዘገየ መተግበሪያው "በመጫን ላይ" ማያ ላይ እንዳይቆም sync.js ራሱ ከበስተጀርባ (ensureSdk) ይጭነዋል። -->

<script>
// ==== database.js ====
/**
 * database.js
 * ---------------------------------------------------------------------------
 * የቢዝነስ ዳታ ንብርብር (Data Layer)
 *
 * ⚠️ አስፈላጊ የደህንነት መርህ፦
 * ይህ ፋይል የቢዝነስ ዳታን ብቻ ይይዛል (stock, sales, credits, expenses, ...).
 * PIN hash, activation/license, lock-out counters የመሳሰሉት የደህንነት መረጃዎች
 * በተለየ namespace (SBM_SEC_*) በ auth.js / activation.js ውስጥ ብቻ ይቀመጣሉ።
 * ይህ መለያየት ለምን አስፈለገ? DB.export() ስንል የደህንነት ሚስጥሮች በስህተት ተካትተው
 * ወደ ባካፕ ፋይል ውስጥ እንዳይወጡ ለመከላከል ነው (defense in depth).
 * ---------------------------------------------------------------------------
 */
(function (global) {
  "use strict";

  const STORAGE_PREFIX = "sbm_"; // Business-data keys only.

  /** In-memory fallback if localStorage is unavailable (private mode, quota, etc). */
  const memoryFallback = {};

  function storageAvailable() {
    try {
      const k = "__sbm_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    } catch (e) {
      return false;
    }
  }
  const HAS_LS = storageAvailable();

  function rawGet(key) {
    if (HAS_LS) return localStorage.getItem(key);
    return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? memoryFallback[key] : null;
  }
  function rawSet(key, value) {
    if (HAS_LS) { localStorage.setItem(key, value); return; }
    memoryFallback[key] = value;
  }
  function rawRemove(key) {
    if (HAS_LS) { localStorage.removeItem(key); return; }
    delete memoryFallback[key];
  }

  /** Keys stored as raw strings (not JSON). */
  const RAW_KEYS = new Set(["companyName", "theme"]);

  function defaultSchema() {
    return {
      companyName: "ስማርት ቢዝነስ",
      theme: "light-theme",
      vatEnabled: true,
      stock: [],
      sales: [],
      credits: [],
      creditHistory: {},
      expenses: [],
      vatInputs: {},
      stockRequests: [], // የሰራተኛ የእቃ ጥያቄዎች: { id, date, by, kind, desc, total, status, ... }
      stockCounts: [], // የስቶክ ቆጠራ መዝገብ: { id, date, by, adjusted, lines:[{name,unit,system,counted,diff,value}] }
      alerts: [], // ለአድሚን ማሳወቂያዎች: { id, date, type, by, text, amount, read }
      returns: [], // የተመላሽ እቃ መዝገብ (ኦዲት): { id, date, saleId, customer, items, amount, by, full }
      debtPayments: [], // የዱቤ ክፍያ መሰብሰቢያ መዝገብ: { id, date, customer, amount, method: "cash"|"bank", ref }
      monthlyReports: {}, // የተዘጉ ወራት ማጠቃለያ (ቁልፍ "ዓ.ም-ወር")፦ የሽያጭ ታሪክ ቢጸዳም እዚህ ይቆያል
    };
  }

  const DB = defaultSchema();

  /** Loads every business-data field from storage into the in-memory DB object. */
  function loadAll() {
    const schema = defaultSchema();
    Object.keys(schema).forEach((key) => {
      const stored = rawGet(STORAGE_PREFIX + key);
      if (stored === null || stored === undefined) {
        DB[key] = schema[key];
        return;
      }
      if (RAW_KEYS.has(key)) {
        DB[key] = stored;
      } else {
        try {
          DB[key] = JSON.parse(stored);
        } catch (e) {
          console.warn("sbm database: corrupt field, resetting →", key, e);
          DB[key] = schema[key];
        }
      }
    });
  }

  /** Persists one field of DB back to storage. */
  function save(key) {
    if (!(key in DB)) return;
    const value = DB[key];
    if (RAW_KEYS.has(key)) {
      rawSet(STORAGE_PREFIX + key, String(value));
    } else {
      rawSet(STORAGE_PREFIX + key, JSON.stringify(value));
    }
    // Cloud backup: fire a debounced push if sync.js has been loaded and initialized.
    // localStorage above is already the source of truth by this point — this is
    // purely a best-effort background copy, never blocking or required for save() to work.
    if (global.SBM && global.SBM.sync && global.SBM.sync.pushToCloud) {
      global.SBM.sync.pushToCloud();
    }
  }

  /** Exports a safe, security-free snapshot of business data for backup. */
  function exportSnapshot() {
    // Explicit whitelist copy — safer than {...DB} + delete, because it can
    // never accidentally leak a field that gets added to DB later.
    return {
      companyName: DB.companyName,
      vatEnabled: DB.vatEnabled,
      stock: DB.stock,
      sales: DB.sales,
      credits: DB.credits,
      creditHistory: DB.creditHistory,
      expenses: DB.expenses,
      vatInputs: DB.vatInputs,
      debtPayments: DB.debtPayments,
      returns: DB.returns,
      alerts: DB.alerts,
      stockCounts: DB.stockCounts,
      stockRequests: DB.stockRequests,
      monthlyReports: DB.monthlyReports,
      exportedAt: new Date().toISOString(),
      schemaVersion: 2,
    };
  }

  /** Restores business data fields from a parsed backup object. Never touches security data. */
  function importSnapshot(data) {
    if (!data || typeof data !== "object") throw new Error("Invalid backup payload");
    const fields = ["stock", "sales", "credits", "creditHistory", "expenses", "companyName", "vatInputs", "vatEnabled", "debtPayments", "monthlyReports", "returns", "alerts", "stockCounts", "stockRequests"];
    fields.forEach((f) => {
      if (data[f] !== undefined) DB[f] = data[f];
    });
    fields.forEach(save);
  }

  function resetTransactionalData() {
    DB.sales = [];
    DB.expenses = [];
    DB.credits = [];
    DB.creditHistory = {};
    DB.debtPayments = [];
    ["sales", "expenses", "credits", "creditHistory", "debtPayments"].forEach(save);
    // ሌሎች ስልኮች የድሮውን ታሪክ መልሰው እንዳያመጡ ለደመናው "reset" መኖሩን ያሳውቃል
    if (global.SBM && global.SBM.sync && global.SBM.sync.onReset) global.SBM.sync.onReset();
  }

  global.SBM = global.SBM || {};
  global.SBM.DB = DB;
  global.SBM.database = {
    loadAll,
    save,
    exportSnapshot,
    importSnapshot,
    resetTransactionalData,
    hasLocalStorage: HAS_LS,
  };
})(window);

// ==== app.js ====
/**
 * app.js — Bootstrap, Navigation, Shared Utilities
 * ---------------------------------------------------------------------------
 * ይህ ፋይል ማንኛውንም ሚስጥር (PIN/License) አይይዝም — ናቪጌሽን፣ የጋራ helper functions፣
 * እና የስክሪኖች መቀያየር (splash → activation/login → dashboard) ብቻ ነው የሚይዘው።
 * ---------------------------------------------------------------------------
 */
(function (global) {
  "use strict";

  // ========== Shared utils (used by every module) ==========
  const ethMonthsAmharic = ["መስከረም", "ጥቅምት", "ህዳር", "ታህሳስ", "ጥር", "የካቲት", "መጋቢት", "ሚያዝያ", "ግንቦት", "ሰኔ", "ሐምሌ", "ነሐሴ", "ጳጉሜ"];

  function escapeHTML(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function jsAttr(v) { return escapeHTML(JSON.stringify(String(v ?? ""))); }

  let toastTimer;
  function showToast(m) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.innerText = m;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), 3000);
  }

  // ---------- Ethiopian calendar helpers ----------
  function getEthDateObj() {
    const now = new Date();
    const gY = now.getFullYear(), gM = now.getMonth() + 1, gD = now.getDate();
    let a = Math.floor((14 - gM) / 12);
    let y = gY + 4800 - a;
    let m = gM + 12 * a - 3;
    let jdn = gD + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    let r = (jdn - 1723856) % 1461;
    let n = (r % 365) + 365 * Math.floor(r / 1460);
    let eY = 4 * Math.floor((jdn - 1723856) / 1461) + Math.floor(r / 365) - Math.floor(r / 1460);
    let eM = Math.floor(n / 30) + 1;
    let eD = (n % 30) + 1;
    if (eM > 13) { eM = 1; eY += 1; }
    return { year: eY, month: eM, date: eD };
  }
  function getEthDateStr() { const e = getEthDateObj(); return ethMonthsAmharic[e.month - 1] + " " + e.date + "፣ " + e.year + " ዓ.ም"; }
  function getCurrentEthYMD() { const e = getEthDateObj(); return e.year + "-" + String(e.month).padStart(2, "0") + "-" + String(e.date).padStart(2, "0"); }
  function isDateOverdue(s) {
    if (!s) return false;
    const p = s.split("-");
    if (p.length !== 3) return false;
    const c = getEthDateObj();
    const y = +p[0], m = +p[1], d = +p[2];
    if (c.year > y) return true;
    if (c.year === y && c.month > m) return true;
    if (c.year === y && c.month === m && c.date > d) return true;
    return false;
  }
  function renderEthiopicDatePickerHTML(prefix) {
    const cur = getEthDateObj();
    let d = "", m = "", y = "";
    for (let i = 1; i <= 30; i++) d += `<option value="${i}"${i === cur.date ? " selected" : ""}>${i}</option>`;
    ethMonthsAmharic.forEach((mm, idx) => { m += `<option value="${idx + 1}"${idx + 1 === cur.month ? " selected" : ""}>${mm}</option>`; });
    for (let yy = cur.year; yy <= cur.year + 5; yy++) y += `<option value="${yy}">${yy}</option>`;
    return `<div class="eth-date-picker"><select id="${prefix}_day">${d}</select><select id="${prefix}_month">${m}</select><select id="${prefix}_year">${y}</select></div>`;
  }
  function getSelectedEthDateValue(prefix) {
    const d = document.getElementById(prefix + "_day"), m = document.getElementById(prefix + "_month"), y = document.getElementById(prefix + "_year");
    if (!d || !m || !y) return "";
    return y.value + "-" + m.value.padStart(2, "0") + "-" + d.value.padStart(2, "0");

    if (!s) return "አልተጠቀሰም";

    const mi = +p[1] - 1;
    if (!ethMonthsAmharic[mi]) return s;
    return ethMonthsAmharic[mi] + " " + p[2] + "፣ " + p[0] + " ዓ.ም";
  }

  function printModalContent() {

    if (vatIn) {

    const frame = document.createElement("iframe");
    frame.style.position = "fixed"; frame.style.width = "0"; frame.style.height = "0"; frame.style.border = "0";
    document.body.appendChild(frame);
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(`<html><head><meta charset="UTF-8"><title>Print</title><style>
      body{font-family:Segoe UI,Tahoma,sans-serif;padding:20px;color:#000;font-size:14px;line-height:1.9;}
      h2,h3,h4{text-align:center;margin:10px 0;} p{margin:8px 0;}
      table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0;}
      th,td{border:1px solid #ccc;padding:6px;text-align:left;}
      hr{border:none;border-top:1px dashed #999;margin:12px 0;} .hidden{display:none !important;}
      <\/style><\/head><body>${clone.innerHTML}<\/body><\/html>`);
    doc.close();
    setTimeout(() => { frame.contentWindow.focus(); frame.contentWindow.print(); setTimeout(() => frame.remove(), 2000); }, 300);
  }

  function shareCurrentPage() {
    const body = document.getElementById("modalBody");
    const titleEl = document.getElementById("modalTitle");
    if (!body) return;
    const clone = body.cloneNode(true);
    clone.querySelectorAll("button, input, select").forEach((el) => el.remove());
    const text = (titleEl ? titleEl.innerText + "\n" : "") + clone.innerText.trim();

    if (navigator.share) {
      navigator.share({ title: "Smart Business Manager", text }).catch(() => copyToClipboard(text));
      return;
    }
    copyToClipboard(text);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(() => showToast("ተቀድቷል! ወደ ቴሌግራም/ላከበት ቦታ ይለጥፉ 📋"))
        .catch(() => legacyCopy(text));
    } else {
      legacyCopy(text);
    }
  }

  function legacyCopy(text) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("ተቀድቷል! ወደ ቴሌግራም/ላከበት ቦታ ይለጥፉ 📋");
    } catch (e) {
      showToast("ኮፒ ማድረግ አልተቻለም። ጽሁፉን በእጅ ይምረጡ።");
    }
  }

  // ========== Login ==========
  async function handleLogin() {
    const p = document.getElementById("pinInput");
    if (!p) return;
    const result = await SBM.auth.verifyLogin(p.value);
    if (result.locked) {
      const secs = Math.ceil(result.remainingMs / 1000);
      showToast(`በጣም ብዙ ስህተት ተከስቷል! እባክዎ ${secs} ሰከንድ ይጠብቁ ⏳`);
      p.value = "";
      return;
    }
    if (result.ok) {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("appShell").classList.remove("hidden");
      document.getElementById("headerCompName").innerText = SBM.DB.companyName;
      renderDashboardMenu();
      p.value = "";
      showToast("እንኳን ደህና መጡ " + result.name + "!");
      if (SBM.auth.isAdmin() && SBM.backup && SBM.backup.cloudStatusInfo && !SBM.backup.cloudStatusInfo().ok) {
        setTimeout(() => showToast(SBM.backup.cloudStatusInfo().text), 12000);
      }
      if (SBM.auth.isAdmin() && SBM.backup && SBM.backup.backupAgeDays() > 7) {
        setTimeout(() => showToast("💾 ባካፕ ከ7 ቀን በላይ ሆኗል — «ባካፕ & ማጽጃ» ውስጥ ይላኩ"), 9500);
      }
      if (SBM.auth.isAdmin() && SBM.stock && SBM.stock.pendingRequestCount() > 0) {
        setTimeout(() => showToast("📥 " + SBM.stock.pendingRequestCount() + " የእቃ ጥያቄ ፍቃድዎን ይጠብቃል"), 6500);
      }
      if (SBM.auth.isAdmin() && unreadAlertCount() > 0) {
        setTimeout(() => showToast("🔔 " + unreadAlertCount() + " አዲስ ማሳወቂያ አለ — «ማሳወቂያ» ይመልከቱ"), 3300);
      }
      // አድሚን ሲገባ፦ የተጠናቀቁ ወራት በራሳቸው ይዘጋሉ (ይቀመጣሉ)፣ የወሩ መጨረሻ ቀን ከሆነም ማሳሰቢያ ይታያል።
      if (SBM.auth.isAdmin() && SBM.report && SBM.report.closeFinishedMonths) {
        const closed = SBM.report.closeFinishedMonths();
        if (closed.length) {
          setTimeout(() => showToast("📆 የ" + closed.map((c) => c.monthName).join("፣ ") + " ወር ሪፖርት ተዘጋጅቷል — «የወር ሪፖርት» ይመልከቱ"), 1800);
        } else if (SBM.report.isMonthEndToday()) {
          setTimeout(() => showToast("📆 ዛሬ የወሩ መጨረሻ ቀን ነው — «የወር ሪፖርት» ዝግጁ ነው"), 1800);
        }
      }
    } else {
      showToast(`የተሳሳተ ፒን (PIN) ነው! (${result.attemptsLeft} ተጨማሪ ሙከራ ይቀራል)`);
      p.value = "";
    }
  }

  // ========== Forgot PIN (recovery-code based, no plaintext reset) ==========
  async function forgotPIN() {
    const code = prompt("🔑 የመልሶ ማግኛ ኮድ (Recovery Code) ያስገቡ፡\n(ፒን ሲፈጥሩ/ሲቀይሩ አንድ ጊዜ ታይቶ የነበረ ኮድ)");
    if (!code) return;
    const valid = await SBM.auth.verifyRecoveryCode(code);
    if (!valid) return showToast("የመልሶ ማግኛ ኮዱ ትክክል አይደለም! ❌");
    const newPin = prompt("አዲስ ፒን ያስገቡ (ቢያንስ 4 አሃዝ)፡");
    if (!newPin || newPin.trim().length < 4) return showToast("ትክክለኛ ፒን አላስገቡም!");
    if (await SBM.auth.isPinInUse(newPin.trim(), { exceptAdmin: true })) return showToast("ይህ ፒን በአንድ ሰራተኛ ተይዟል! ሌላ ይምረጡ።");
    const recoveryCode = await SBM.auth.setPin(newPin.trim());
    alert("✅ ፒን ተቀናብሯል!\n\n📝 አዲስ የመልሶ ማግኛ ኮድ፦\n\n" + recoveryCode + "\n\nይህንን ጽፈው ያስቀምጡ — ዳግም አይታይም!");
  }

    if (!result.ok) {
      const reasons = {
        "bad-format": "የፍቃድ ኮዱ ቅርጸት ትክክል አይደለም።",
        "bad-signature": "የፍቃድ ኮዱ ልክ አይደለም (ፊርማ አልተረጋገጠም)።",
        "shop-mismatch": "ይህ ፍቃድ ለዚህ የሱቅ ስም አይሰራም። የሱቁን ስም በትክክል ያስገቡ።",
        "expired": "የፍቃድ ኮዱ ጊዜው አልፎበታል።",
        "malformed": "የፍቃድ ኮዱ ሊነበብ አልቻለም።",
      };
      showToast("❌ " + (reasons[result.reason] || "ማንቃት አልተሳካም።"));
      return;
    }
    document.getElementById("activationScreen").classList.add("hidden");

    if (!SBM.auth.isPinSet()) {
      // First-time setup: ask the shop owner to choose their own PIN instead
      // of shipping a default "1234" that everyone who reads the code knows.
      let newPin = prompt("🔑 አዲስ ፒን (ቢያንስ 4 አሃዝ) ይምረጡ፦");
      while (!newPin || newPin.trim().length < 4) {
        newPin = prompt("ፒኑ ቢያንስ 4 አሃዝ ሊሆን ይገባል። እንደገና ይሞክሩ፦");
        if (newPin === null) { newPin = "0000"; break; }
      }
      const recoveryCode = await SBM.auth.setPin(newPin.trim());
      alert("✅ ተነቃቅቷል!\n\n📝 የመልሶ ማግኛ ኮድ (Recovery Code)፦\n\n" + recoveryCode + "\n\n⚠️ ፒንዎን ቢረሱ ብቻ የሚያስፈልግዎ ነው። በወረቀት ላይ ጽፈው በጥንቃቄ ያስቀምጡት — ዳግም አይታይም!");
    }
    document.getElementById("loginScreen").classList.remove("hidden");
    showToast("ተነቃቅቷል! እንኳን ደህና መጡ ✅");
    if (SBM.sync) SBM.sync.start();
  }

  // ========== Bootstrap ==========
  document.addEventListener("DOMContentLoaded", async function () {
    SBM.database.loadAll();
    document.body.className = SBM.DB.theme;

    // Cloud backup: initialize Firebase (no-op safely if SDK/network unavailable),
    // then offer to restore from the cloud if this device's local data is empty
    // (e.g. a brand-new phone activated with an existing shop's license key).
    if (SBM.sync) SBM.sync.init();

    const tp = document.getElementById("togglePinBtn");
    if (tp) tp.addEventListener("click", function () {
      const p = document.getElementById("pinInput");
      if (!p) return;
      if (p.type === "password") { p.type = "text"; tp.textContent = "ደብቅ"; }
      else { p.type = "password"; tp.textContent = "ግልጽ"; }
    });

    const ov = document.getElementById("modalOverlay");
    if (ov) ov.addEventListener("click", (e) => { if (e.target === ov) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    const header = document.querySelector(".modal-header");
    if (header && !document.getElementById("shareBtn")) {
      const b = document.createElement("button");
      b.id = "shareBtn"; b.type = "button"; b.className = "icon-btn";
      b.style.fontSize = "18px"; b.innerText = "📤";
      b.onclick = shareCurrentPage;
      header.insertBefore(b, header.lastElementChild);
    }

    const activated = await SBM.activation.isActivated();
    // ደመና ማመሳሰል (ጸጥ ያለ፣ በራሱ)፦ ፍቃድ ካለ ብቻ ይጀምራል
    if (activated && SBM.sync) SBM.sync.start();

    setTimeout(function () {
      const s = document.getElementById("splashScreen");
      if (s) s.classList.add("hidden");
      if (!activated) {
        const act = document.getElementById("activationScreen");
        if (act) act.classList.remove("hidden");
      } else {
        const l = document.getElementById("loginScreen");
        if (l) l.classList.remove("hidden");
      }
    }, 1000);
  });

  global.SBM.app = {
    openPage, closeModal, toggleTheme, printModalContent, shareCurrentPage,
    handleLogin, handleLogout, forgotPIN, tryActivate, renderDashboardMenu, addAlert,
  };
  window.print = printModalContent;
})(window);

/**
 * auth.js
 * ---------------------------------------------------------------------------
 * PIN ማረጋገጫ ስርዓት — Web Crypto API (SHA-256, salted) ተጠቅሞ
 *
 * ማንኛውም ቦታ ላይ PIN በGLIB TEXT (Plain Text) አይቀመጥም/አይነበብም።
 * DB export/backup ውስጥም አይካተትም (ይህ ፋይል ራሱን ችሎ የራሱ storage namespace አለው)።
 *
 * ⚠️ ገደብ (Honesty note, see requirement #9 / README-SECURITY.md)፦
 * ይህ ሁሉ ኮድ በራሱ Browser ውስጥ ስለሚሮጥ፣ ማንኛውም ተጠቃሚ Developer Tools ከፍቶ
 * ይህንኑ ኮድ ማንበብ/ማስተካከል ይችላል። Salted hashing የሚከላከለው "ቀላል ጥቃቶችን"
 * (ለምሳሌ rainbow table, plain-text ንባብ) እንጂ በራሱ browser ላይ ሙሉ ቁጥጥር
 * ያለውን ተጠቃሚ ማስቆም አይችልም። ይህ ያለ backend ሊፈታ የማይችል ውስንነት ነው።
 * ---------------------------------------------------------------------------
 */
(function (global) {
  "use strict";

  const SEC_PREFIX = "sbm_sec_"; // Isolated from business-data keys in database.js.

  const K_PIN_HASH = SEC_PREFIX + "pinHash";
  const K_PIN_SALT = SEC_PREFIX + "pinSalt";
  const K_RECOVERY_HASH = SEC_PREFIX + "recoveryHash";
  const K_ATTEMPTS = SEC_PREFIX + "attempts";
  const K_LOCK_UNTIL = SEC_PREFIX + "lockUntil";
  const K_STAFF = SEC_PREFIX + "staff"; // ሰራተኞች: [{ id, name, salt, hash }] — ፒናቸው በ salted hash ብቻ

  // የአሁኑ ተጠቃሚ (በሜሞሪ ብቻ — ገጹ ሲዘጋ/ሲወጣ ይጠፋል)፦ { role: "admin" | "staff", name, staffId }
  let session = null;

  const MAX_ATTEMPTS = 5;
  const BASE_LOCK_MS = 30 * 1000;      // 30 ሰከንድ
  const MAX_LOCK_MS = 10 * 60 * 1000;  // 10 ደቂቃ ጣሪያ

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore quota errors */ } }
  function lsRemove(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---------- Web Crypto helpers ----------

  function bufToHex(buf) {
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  }

  function randomSaltHex(bytes = 16) {
    const arr = new Uint8Array(bytes);
    crypto.getRandomValues(arr);
    return bufToHex(arr);
  }

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest("SHA-256", data);
    return bufToHex(digest);
  }

  async function hashWithSalt(value, saltHex) {
    // Salted hash: SHA-256(salt + ":" + value). Simple but standard practice
    // for client-only apps where a full KDF (PBKDF2/Argon2) offers no real
    // extra protection since the verifying code is visible to the user anyway.
    return sha256Hex(saltHex + ":" + String(value));
  }

  function constantTimeEqual(a, b) {
    if (typeof a !== "string" || typeof b !== "string" || a.length !== b.length) return false;
    let diff = 0;
    for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
  }

  // ---------- PIN lifecycle ----------

  function isPinSet() {
    return !!lsGet(K_PIN_HASH);
  }

  /** Sets (or resets) the PIN. Returns a one-time recovery code the caller MUST show once. */
  async function setPin(newPin) {
    const salt = randomSaltHex();
    const hash = await hashWithSalt(newPin, salt);
    lsSet(K_PIN_SALT, salt);
    lsSet(K_PIN_HASH, hash);
    lsSet(K_ATTEMPTS, "0");
    lsRemove(K_LOCK_UNTIL);

    // Recovery code: shown ONCE to the shop owner (e.g. "ወረቀት ላይ ጻፉት!").
    // Needed because a salted hash cannot be reversed — if the PIN is
    // forgotten there is no "decrypt" option, only a guarded reset path.
    const recoveryCode = randomSaltHex(4).toUpperCase(); // 8-char code
    const recoverySalt = randomSaltHex();
    const recoveryHash = await hashWithSalt(recoveryCode, recoverySalt);
    lsSet(SEC_PREFIX + "recoverySalt", recoverySalt);
    lsSet(K_RECOVERY_HASH, recoveryHash);

    return recoveryCode;
  }

  function getLockRemainingMs() {
    const until = parseInt(lsGet(K_LOCK_UNTIL) || "0", 10);
    const remaining = until - Date.now();
    return remaining > 0 ? remaining : 0;
  }

  function registerFailedAttempt() {
    const attempts = parseInt(lsGet(K_ATTEMPTS) || "0", 10) + 1;
    lsSet(K_ATTEMPTS, String(attempts));
    if (attempts >= MAX_ATTEMPTS) {
      const overBy = attempts - MAX_ATTEMPTS;
      const lockMs = Math.min(BASE_LOCK_MS * Math.pow(2, overBy), MAX_LOCK_MS);
      lsSet(K_LOCK_UNTIL, String(Date.now() + lockMs));
    }
  }

  function clearAttempts() {
    lsSet(K_ATTEMPTS, "0");
    lsRemove(K_LOCK_UNTIL);
  }

  /**
   * Verifies a PIN attempt.
   * Returns { ok, locked, remainingMs, attemptsLeft }
   */
  async function verifyPin(pin) {
    const remaining = getLockRemainingMs();
    if (remaining > 0) {
      return { ok: false, locked: true, remainingMs: remaining, attemptsLeft: 0 };
    }
    const salt = lsGet(K_PIN_SALT);
    const storedHash = lsGet(K_PIN_HASH);
    if (!salt || !storedHash) {
      return { ok: false, locked: false, remainingMs: 0, attemptsLeft: MAX_ATTEMPTS, notSet: true };
    }
    const attemptHash = await hashWithSalt(pin, salt);
    const ok = constantTimeEqual(attemptHash, storedHash);
    if (ok) {
      clearAttempts();
      return { ok: true, locked: false, remainingMs: 0, attemptsLeft: MAX_ATTEMPTS };
    }
    registerFailedAttempt();
    const attempts = parseInt(lsGet(K_ATTEMPTS) || "0", 10);
    const lockedNow = getLockRemainingMs() > 0;
    return {
      ok: false,
      locked: lockedNow,
      remainingMs: getLockRemainingMs(),
      attemptsLeft: Math.max(0, MAX_ATTEMPTS - attempts),
    };
  }

  /** Recovery flow: verify recovery code, then allow setting a brand-new PIN. */
  async function verifyRecoveryCode(code) {
    const salt = lsGet(SEC_PREFIX + "recoverySalt");
    const storedHash = lsGet(K_RECOVERY_HASH);
    if (!salt || !storedHash) return false;
    const attemptHash = await hashWithSalt(code.trim().toUpperCase(), salt);
    return constantTimeEqual(attemptHash, storedHash);
  }

  async function changePin(oldPin, newPin) {
    const check = await verifyPin(oldPin);
    if (!check.ok) return { ok: false, reason: "wrong-old-pin" };
    // የአድሚን ፒን ከማንኛውም ሰራተኛ ፒን ጋር መመሳሰል የለበትም
    if (await isPinInUse(newPin, { exceptAdmin: true })) return { ok: false, reason: "pin-in-use" };
    const recoveryCode = await setPin(newPin);
    return { ok: true, recoveryCode };
  }

  // ---------- ሰራተኞች (Staff) + ሚና (Role) ----------

  function readStaff() {
    try {
      const a = JSON.parse(lsGet(K_STAFF) || "[]");
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function writeStaff(list) { lsSet(K_STAFF, JSON.stringify(list)); }

  /** ስም እና መታወቂያ ብቻ (hash/salt ፈጽሞ አይመለስም) */
  function getStaffList() { return readStaff().map((s) => ({ id: s.id, name: s.name })); }

  /** ይህ ፒን አስቀድሞ በአድሚንም ሆነ በሌላ ሰራተኛ ተይዟል? */
  async function isPinInUse(pin, opts) {
    opts = opts || {};
    const p = String(pin);
    if (!opts.exceptAdmin) {
      const salt = lsGet(K_PIN_SALT), h = lsGet(K_PIN_HASH);
      if (salt && h && constantTimeEqual(await hashWithSalt(p, salt), h)) return true;
    }
    for (const s of readStaff()) {
      if (opts.exceptStaffId && s.id === opts.exceptStaffId) continue;
      if (constantTimeEqual(await hashWithSalt(p, s.salt), s.hash)) return true;
    }
    return false;
  }

  async function addStaff(name, pin) {
    name = String(name || "").trim();
    pin = String(pin || "").trim();
    if (!name) return { ok: false, reason: "no-name" };
    if (pin.length < 4) return { ok: false, reason: "short-pin" };
    const list = readStaff();
    if (list.some((s) => s.name.toLowerCase() === name.toLowerCase())) return { ok: false, reason: "dup-name" };
    if (await isPinInUse(pin)) return { ok: false, reason: "pin-in-use" };
    const salt = randomSaltHex();
    list.push({ id: Date.now().toString(36) + randomSaltHex(2), name, salt, hash: await hashWithSalt(pin, salt) });
    writeStaff(list);
    return { ok: true };
  }

  async function resetStaffPin(id, newPin) {
    newPin = String(newPin || "").trim();
    if (newPin.length < 4) return { ok: false, reason: "short-pin" };
    const list = readStaff();
    const s = list.find((x) => x.id === id);
    if (!s) return { ok: false, reason: "not-found" };
    if (await isPinInUse(newPin, { exceptStaffId: id })) return { ok: false, reason: "pin-in-use" };
    s.salt = randomSaltHex();
    s.hash = await hashWithSalt(newPin, s.salt);
    writeStaff(list);
    return { ok: true };
  }

  function removeStaff(id) {
    writeStaff(readStaff().filter((s) => s.id !== id));
  }

  /**
   * የመግቢያ ማረጋገጫ — አንድ ፒን ሳጥን ብቻ፦ የአድሚን ፒን ከሆነ → admin፣ የሰራተኛ ፒን ከሆነ → staff (ስሙ ጋር)።
   * የተሳሳተ ሙከራ ለሁሉም በአንድ ላይ ይቆጠራል (የመቆለፍ ጥበቃ ያው ነው)።
   */
  async function verifyLogin(pin) {
    const remaining = getLockRemainingMs();
    if (remaining > 0) {
      return { ok: false, locked: true, remainingMs: remaining, attemptsLeft: 0 };
    }
    const p = String(pin == null ? "" : pin);
    const salt = lsGet(K_PIN_SALT);
    const storedHash = lsGet(K_PIN_HASH);
    if (!salt || !storedHash) {
      return { ok: false, locked: false, remainingMs: 0, attemptsLeft: MAX_ATTEMPTS, notSet: true };
    }
    if (constantTimeEqual(await hashWithSalt(p, salt), storedHash)) {
      clearAttempts();
      session = { role: "admin", name: "አድሚን", staffId: null };
      return { ok: true, role: "admin", name: session.name, locked: false, remainingMs: 0, attemptsLeft: MAX_ATTEMPTS };
    }
    for (const s of readStaff()) {
      if (constantTimeEqual(await hashWithSalt(p, s.salt), s.hash)) {
        clearAttempts();
        session = { role: "staff", name: s.name, staffId: s.id };
        return { ok: true, role: "staff", name: s.name, locked: false, remainingMs: 0, attemptsLeft: MAX_ATTEMPTS };
      }
    }
    registerFailedAttempt();
    const attempts = parseInt(lsGet(K_ATTEMPTS) || "0", 10);
    return {
      ok: false,
      locked: getLockRemainingMs() > 0,
      remainingMs: getLockRemainingMs(),
      attemptsLeft: Math.max(0, MAX_ATTEMPTS - attempts),
    };
  }

  function getSession() { return session ? { role: session.role, name: session.name, staffId: session.staffId } : null; }
  function isAdmin() { return !!session && session.role === "admin"; }
  function currentName() { return session ? session.name : ""; }
  function clearSession() { session = null; }

  global.SBM = global.SBM || {};
  global.SBM.auth = {
    isPinSet,
    setPin,
    verifyPin,
    verifyRecoveryCode,
    changePin,
    getLockRemainingMs,
    verifyLogin, getSession, isAdmin, currentName, clearSession,
    getStaffList, addStaff, resetStaffPin, removeStaff, isPinInUse,
    sha256Hex,   // exposed for activation.js / backup.js integrity checks
    hashWithSalt,
    randomSaltHex,
  };
})(window);

/**
 * activation.js
 * ---------------------------------------------------------------------------
 * License / Activation ስርዓት — ECDSA (P-256) Digital Signature ተጠቅሞ
 *
 * እንዴት ይሰራል፦
 *  1) አንተ (ገንቢው) አንድ ጊዜ ብቻ የ"ግል ቁልፍ/Private Key" እና "የህዝብ ቁልፍ/Public Key"
 *     ጥንድ በ dev-tools/keygen.html ትፈጥራለህ (ከዚህ app ውጪ፣ ኮምፒውተር ላይ ብቻ)።
 *  2) Private Key ላንተ ብቻ የሚታይ ሆኖ ደህንነቱ በተጠበቀ ቦታ ትቀምጠዋለህ (ለምሳሌ
 *     ላፕቶፕህ ላይ ባለ ፋይል፣ ማንም ደንበኛ አያገኘውም)።
 *  3) Public Key ግን "ሚስጥር" አይደለም — በዚህ ፋይል ውስጥ በነጻነት ይካተታል፣ ምክንያቱም
 *     Public Key ብቻውን ምንም ማምረት/ማጭበርበር አይችልም፤ የፊርማ ማረጋገጫ ብቻ ነው የሚያደርገው።
 *  4) ለእያንዳንዱ ደንበኛ የሱቅ ስም + (በፈለግክ ጊዜ የማብቂያ ቀን) ፈርመህ የፍቃድ ኮድ
 *     (License Key) ትሰጠዋለህ። ደንበኛው ያንን ኮድ አፑ ውስጥ ሲያስገባ፣ አፑ Public Key
 *     ተጠቅሞ ፊርማውን ያረጋግጣል — ያለ ኢንተርኔት፣ ያለ Backend!
 *

    if (!rec || !rec.licenseKey) return null;
    cloudId = await SBM.auth.sha256Hex("SBM-CLOUD-v2:" + rec.licenseKey);
    return cloudId;
  }

  function metaRef() { return db.collection("shops").doc(cloudId); }
  function docsRef() { return metaRef().collection("docs"); }

  // ---------- local snapshot as a flat map of documents ----------

  function collect() {
    const DB = SBM.DB;
    const out = new Map();
    const put = (t, k, obj) => {
      const d = JSON.stringify(obj);
      out.set(docId(t, k), { t, k: String(k), d, h: hashStr(d) });
    };
    (DB.sales || []).forEach((r) => { if (r && r.id != null) put("sale", r.id, r); });
    (DB.expenses || []).forEach((r) => { if (r && r.id != null) put("expense", r.id, r); });
    (DB.debtPayments || []).forEach((r) => { if (r && r.id != null) put("debtpay", r.id, r); });
    (DB.returns || []).forEach((r) => { if (r && r.id != null) put("ret", r.id, r); });
    (DB.alerts || []).forEach((r) => { if (r && r.id != null) put("alert", r.id, r); });
    (DB.stockCounts || []).forEach((r) => { if (r && r.id != null) put("scount", r.id, r); });
    (DB.stockRequests || []).forEach((r) => { if (r && r.id != null) put("sreq", r.id, r); });
    (DB.stock || []).forEach((r) => { if (r && r.id != null) put("stock", r.id, r); });
    (DB.credits || []).forEach((r) => { if (r && r.customer) put("credit", String(r.customer).toLowerCase(), r); });
    Object.keys(DB.creditHistory || {}).forEach((n) => put("chist", n, DB.creditHistory[n]));
    Object.keys(DB.vatInputs || {}).forEach((k) => put("vatin", k, DB.vatInputs[k]));
    Object.keys(DB.monthlyReports || {}).forEach((k) => put("mrep", k, DB.monthlyReports[k]));
    put("cfg", "cfg", { companyName: DB.companyName, vatEnabled: !!DB.vatEnabled });
    return out;
  }

  const APPEND_ONLY = { sale: "sales", expense: "expenses", debtpay: "debtPayments" };

  function isLocalDataEmpty() {
    const DB = SBM.DB;
    return (!DB.stock || DB.stock.length === 0)
      && (!DB.sales || DB.sales.length === 0)
      && (!DB.credits || DB.credits.length === 0);
  }

  // ---------- apply a cloud document to local data ----------

  function applyLocal(t, k, obj, changed) {
    const DB = SBM.DB;
    const arrOp = (key) => {
      if (!Array.isArray(DB[key])) DB[key] = [];
      const arr = DB[key];
      const i = arr.findIndex((x) => x && String(x.id) === k);
      if (obj === null) { if (i >= 0) arr.splice(i, 1); }
      else if (i >= 0) arr[i] = obj;
      else arr.push(obj);
      changed.add(key);
    };
    switch (t) {
      case "sale": case "expense": case "debtpay": arrOp(APPEND_ONLY[t]); break;
      case "stock": arrOp("stock"); break;
      case "ret": arrOp("returns"); break;
      case "alert": arrOp("alerts"); break;
      case "scount": arrOp("stockCounts"); break;
      case "sreq": arrOp("stockRequests"); break;
      case "credit": {
        if (!Array.isArray(DB.credits)) DB.credits = [];
        const i = DB.credits.findIndex((x) => x && String(x.customer || "").toLowerCase() === k);
        if (obj === null) { if (i >= 0) DB.credits.splice(i, 1); }
        else if (i >= 0) DB.credits[i] = obj;
        else DB.credits.push(obj);
        changed.add("credits");
        break;
      }
      case "chist":
        if (!DB.creditHistory || typeof DB.creditHistory !== "object") DB.creditHistory = {};
        if (obj === null) delete DB.creditHistory[k]; else DB.creditHistory[k] = obj;
        changed.add("creditHistory");
        break;
      case "vatin":
        if (!DB.vatInputs || typeof DB.vatInputs !== "object") DB.vatInputs = {};
        if (obj === null) delete DB.vatInputs[k]; else DB.vatInputs[k] = obj;
        changed.add("vatInputs");
        break;
      case "mrep":
        if (!DB.monthlyReports || typeof DB.monthlyReports !== "object") DB.monthlyReports = {};
        if (obj === null) delete DB.monthlyReports[k]; else DB.monthlyReports[k] = obj;
        changed.add("monthlyReports");
        break;
      case "cfg":
        if (obj && typeof obj === "object") {
          if (typeof obj.companyName === "string") DB.companyName = obj.companyName;
          if (typeof obj.vatEnabled === "boolean") DB.vatEnabled = obj.vatEnabled;
          changed.add("companyName"); changed.add("vatEnabled");
        }
        break;
      default: break;
    }
  }

  function persistChanged(changed) {
    if (changed.size === 0) return;
    const DB = SBM.DB;
    ["sales", "expenses", "debtPayments"].forEach((k) => {
      if (changed.has(k) && Array.isArray(DB[k])) DB[k].sort((a, b) => Number(a.id) - Number(b.id));
    });
    applying = true;
    try { changed.forEach((k) => SBM.database.save(k)); } finally { applying = false; }
    try {
      const shell = document.getElementById("appShell");
      const h = document.getElementById("headerCompName");
      if (h) h.innerText = DB.companyName;
      if (shell && !shell.classList.contains("hidden") && SBM.app && SBM.app.renderDashboardMenu) SBM.app.renderDashboardMenu();
    } catch (e) { /* UI refresh is best-effort */ }
  }

  /** ሌላ ስልክ "ሁሉንም አጽዳ" ካደረገ — እዚህም ያለፈው የግብይት ታሪክ ይጸዳል (ከዚያ በኋላ የተመዘገበ ይቆያል)። */
  function applyRemoteReset(resetAt) {
    const DB = SBM.DB;
    const changed = new Set();
    ["sales", "expenses", "debtPayments"].forEach((k) => {
      if (Array.isArray(DB[k])) { DB[k] = DB[k].filter((x) => Number(x.id) > resetAt); changed.add(k); }
    });
    DB.credits = []; DB.creditHistory = {};
    changed.add("credits"); changed.add("creditHistory");
    Object.keys(state.meta).forEach((id) => {
      const t = typeOf(id);
      if (APPEND_ONLY[t] || t === "credit" || t === "chist") delete state.meta[id];
    });
    state.resetSeen = resetAt;
    persistChanged(changed);
    saveState();
  }

  // ---------- pull (cloud → local) ----------

  async function pullDocs(opts) {
    opts = opts || {};
    // 1) የሱቁ ዋና ሰነድ (reset ጊዜ)
    const msnap = await timed(metaRef().get());
    const meta = msnap.exists ? (msnap.data() || {}) : {};
    let cloudReset = Number(meta.resetAt) || 0;
    if (cloudReset > Date.now() + MAX_FUTURE_MS) cloudReset = 0; // የተበላሸ እሴት ችላ ይባላል

    if (state.resetPending) {
      if (state.resetPending > cloudReset) {
        await timed(metaRef().set({ v: 2, resetAt: state.resetPending, s: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }));
        cloudReset = state.resetPending;
      }
      state.resetPending = 0;
      saveState();
    }
    if (cloudReset > state.resetSeen) {
      if (state.linkedThisCycle) { state.resetSeen = cloudReset; } // አዲስ የተገናኘ ስልክ፦ ያለውን ዳታ አያጸዳም
      else applyRemoteReset(cloudReset);
    }
    const resetAt = Math.max(state.resetSeen, cloudReset);

    // 2) ሰነዶች (ከመጨረሻው ማመሳሰል ጀምሮ የተቀየሩት ብቻ)
    let q = docsRef();
    if (!opts.full && state.lastPull) q = q.where("s", ">=", firebase.firestore.Timestamp.fromMillis(state.lastPull));
    const snap = await timed(q.get());
    const cur = collect();
    const changed = new Set();
    let maxS = state.lastPull || 0;
    // ባዶ ስልክ ከደመና ሲመልስ (restore) የደመናው ዳታ ያሸንፋል፤ ዳታ ያለው ስልክ ሲያገናኙ ግን የአካባቢው ይጠበቃል
    const cloudWins = !!(state.linkedThisCycle && state.linkMode === "restore");

    snap.docs.forEach((doc) => {
      const id = doc.id;
      const x = doc.data() || {};
      const sMs = msOf(x.s);
      if (sMs > maxS) maxS = sMs;
      const t = typeOf(id);
      if (!x.t || x.t !== t) return;
      const k = keyOf(id);
      const m = parseMeta(state.meta[id]);
      const local = cur.get(id);

      if (x.x === true) { // tombstone (የስረዛ ምልክት)
        if (local) {
          const dirty = !m || m.h !== local.h;
          if (dirty && !cloudWins) return; // ከመጨረሻ ማመሳሰል በኋላ እዚህ ተቀይሯል — የአካባቢው ያሸንፋል
          applyLocal(t, k, null, changed);
        }
        state.meta[id] = fmtMeta("x", sMs);
        return;
      }

      let obj;
      try { obj = JSON.parse(x.d); } catch (e) { return; }
      if (APPEND_ONLY[t] && obj && Number(obj.id) <= resetAt) return; // ከ reset በፊት የነበረ
      const cloudH = hashStr(x.d);

      if (local) {
        if (local.h === cloudH) { state.meta[id] = fmtMeta(cloudH, sMs); return; }
        const dirty = !m || m.h !== local.h;
        // የአካባቢው ለውጥ አለ — ይላካል (የመጨረሻው ለውጥ ያሸንፋል)። ገና ተመሳስሎ የማያውቅ ቅንብር (ነባሪ ስም) ግን የደመናውን አይተካም።
        if (dirty && !cloudWins && !(t === "cfg" && !m)) return;
        applyLocal(t, k, obj, changed);
        state.meta[id] = fmtMeta(cloudH, sMs);
      } else {
        if (m && m.h !== "x") return; // እዚህ ተሰርዟል — የስረዛው ምልክት ይላካል
        applyLocal(t, k, obj, changed);
        state.meta[id] = fmtMeta(cloudH, sMs);
      }
    });

    persistChanged(changed);
    state.lastPull = maxS;
    saveState();
    return { count: snap.docs.length, changed: changed.size };
  }

  // ---------- push (local → cloud) ----------

  async function pushDocs() {
    const cur = collect();
    const ops = [];
    cur.forEach((v, id) => {
      const m = parseMeta(state.meta[id]);
      if (!m || m.h !== v.h) ops.push({ id, tomb: false, v });
    });
    Object.keys(state.meta).forEach((id) => {
      const m = parseMeta(state.meta[id]);
      if (m && m.h !== "x" && !cur.has(id)) ops.push({ id, tomb: true, t: typeOf(id), k: keyOf(id) });
    });
    if (ops.length === 0) return 0;

    for (let i = 0; i < ops.length; i += BATCH_MAX) {
      const chunk = ops.slice(i, i + BATCH_MAX);
      const batch = db.batch();
      chunk.forEach((op) => {
        const ts = firebase.firestore.FieldValue.serverTimestamp();
        batch.set(docsRef().doc(op.id), op.tomb
          ? { t: op.t, k: op.k, d: "", s: ts, x: true }
          : { t: op.v.t, k: op.v.k, d: op.v.d, s: ts, x: false });
      });
      await timed(batch.commit());
      chunk.forEach((op) => { state.meta[op.id] = op.tomb ? fmtMeta("x", 0) : fmtMeta(op.v.h, 0); });
      saveState();
    }
    return ops.length;
  }

  // ---------- linking a device to the store's cloud data ----------

  function toast(m) { if (SBM.utils && SBM.utils.showToast) SBM.utils.showToast(m); }

  async function askRestoreCode(localEmpty) {
    const wants = confirm(localEmpty
      ? "በደመና ላይ ቀደም ብሎ የተቀመጠ የዚህ ሱቅ ዳታ ተገኝቷል። ዳታውን መልሰው ማግኘት ይፈልጋሉ? (ለዚህ ከሻጭዎ የተሰጠዎት ልዩ ኮድ ያስፈልጋል)"
      : "ይህ ስልክ ከዚህ ሱቅ የደመና ዳታ ጋር ገና አልተገናኘም። ለማገናኘት ከሻጭዎ የተሰጠዎት ልዩ ኮድ ያስፈልጋል። ይቀጥሉ?");
    if (!wants) return false;
    const code = prompt("🔑 የመልሶ ማግኛ ኮድ (Restore Code) ያስገቡ፡\n(ከሻጭዎ ያግኙት)");
    if (!code) return false;
    if (!(await SBM.activation.verifyRestoreToken(getShopName(), code))) { toast("ኮዱ ትክክል አይደለም። ❌"); return false; }
    return true;
  }

  async function tryLink() {
    const msnap = await timed(metaRef().get());
    if (!msnap.exists) {
      // በደመና ላይ ምንም የለም → ይህ የመጀመሪያው ስልክ ነው፤ ራሱ ይገናኛል
      await timed(metaRef().set({ v: 2, s: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }));
      state.linked = true; state.lastPull = 0; saveState();
      return true;
    }
    if (linkAsked) return false;
    linkAsked = true;
    const ok = await askRestoreCode(isLocalDataEmpty());
    if (!ok) return false;
    state.linked = true; state.lastPull = 0; state.linkedThisCycle = true;
    state.linkMode = isLocalDataEmpty() ? "restore" : "merge";
    saveState();
    return true;
  }

  // ---------- one sync cycle ----------

  let current = Promise.resolve();

  /** አንድ ጊዜ አንድ ዑደት ብቻ ይሰራል፤ በሚሰራበት ጊዜ አዲስ ለውጥ ከመጣ ከዚያ በኋላ እንደገና ይሰራል። */
  function runCycle() {
    if (!started || blocked) return Promise.resolve();
    if (running) { again = true; return current; }
    current = doCycle();
    return current;
  }

  async function doCycle() {
    if (typeof navigator !== "undefined" && navigator.onLine === false) return;
    if (Date.now() < nextAllowedAt) return;
    running = true;
    lastAttempt = Date.now();
    try {
      await ensureAuth();
      if (!state.linked) {
        const ok = await tryLink();
        if (!ok) return;
      }
      await pullDocs();
      delete state.linkedThisCycle; delete state.linkMode;
      await pushDocs();
      failCount = 0; nextAllowedAt = 0; lastError = "";
      state.lastSync = Date.now();
      saveState();
    } catch (e) {
      failCount++;
      lastError = String((e && (e.code || e.message)) || e).slice(0, 120);
      resetAuthOnAuthError(e);
      nextAllowedAt = Date.now() + Math.min(60 * 1000, 15000 * Math.pow(2, failCount));
      console.warn("sync.js: cycle failed (will retry automatically)", e && e.message ? e.message : e);
    } finally {
      running = false;
      if (again) { again = false; schedulePush(); }
    }
  }

  function schedulePush() {
    if (applying || !started) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(runCycle, PUSH_DEBOUNCE_MS);
  }

  /** በእጅ "አሁን አመሳስል" — የመጠበቂያ ጊዜውን ይዘለላል። */
  function syncNow() { nextAllowedAt = 0; return runCycle(); }

  /** "ሁሉንም አጽዳ" ሲደረግ ከ database.js ይጠራል። */
  function onReset() {
    if (!state || !state.linked) return;
    const now = Date.now();
    state.resetSeen = now;
    state.resetPending = now;
    Object.keys(state.meta).forEach((id) => { if (APPEND_ONLY[typeOf(id)]) delete state.meta[id]; });
    saveState();
    schedulePush();
  }

  // ---------- start ----------

  async function start() {
    if (started) { runCycle(); return; }
    if (blocked) return;
    if (!ready) {
      if (typeof navigator !== "undefined" && navigator.onLine === false) return;
      if (!(await ensureSdk())) return;
      if (!tryInit()) return;
    }
    if (starting) return;
    starting = true;
    try {
      if (!(await SBM.activation.isActivated())) return;
      const id = await resolveCloudId();
      if (!id) return;
      state = loadState();
      if (state.shop && state.shop !== id) {
        // ይህ ስልክ ከሌላ ሱቅ ፍቃድ ጋር ተገናኝቶ ነበር — የዚያ ሱቅ ዳታ ወደዚህ ሱቅ እንዳይቀላቀል ማመሳሰል ይቆማል።
        blocked = true;
        console.warn("sync.js: this device holds another store's data — cloud sync disabled to keep stores separate");
        return;
      }
      state.shop = id;
      saveState();
      started = true;
      if (typeof window !== "undefined") {
        window.addEventListener("online", () => { failCount = 0; nextAllowedAt = 0; runCycle(); });
        // አፑን ለቆ ወደ ሌላ አፕ ሲሄዱ (ወይም ሲመለሱ) ወዲያው ይልካል — ከበስተጀርባ ሰዓት ቆጣሪዎች ስለሚቆሙ 3 ሰከንድ መጠበቅ አይቻልም
        const flushNow = () => { clearTimeout(pushTimer); runCycle(); };
        document.addEventListener("visibilitychange", flushNow);
        window.addEventListener("pagehide", flushNow);
      }
      pollTimer = setInterval(() => { if (document.visibilityState !== "hidden") runCycle(); }, POLL_MS);
      runCycle();
    } catch (e) {
      console.warn("sync.js: start failed", e);
    } finally {
      starting = false;
    }
  }

  /** በእጅ "ከደመና መልስ" (Backup ገጽ) — የአሁኑን ዳታ በደመናው ይተካል (ኮድ ያስፈልጋል)። */
  async function manualRestore() {
    if (!SBM.utils.requireAdmin()) return;
    try {
      if (!started) await start();
      if (!started) { toast("ደመናው አልተገኘም። ኢንተርኔት እና ፍቃድ ያረጋግጡ።"); return; }
      await ensureAuth();
      const snap = await timed(docsRef().get());
      const live = snap.docs.filter((d) => (d.data() || {}).x !== true);
      if (live.length === 0) { toast("በደመና ላይ ምንም የተቀመጠ ዳታ አልተገኘም።"); return; }
      const code = prompt("🔑 የመልሶ ማግኛ ኮድ (Restore Code) ያስገቡ፡\n(ከሻጭዎ ያግኙት)");
      if (!code) return;
      if (!(await SBM.activation.verifyRestoreToken(getShopName(), code))) { toast("ኮዱ ትክክል አይደለም። ❌"); return; }
      if (!confirm("ማስጠንቀቂያ፡ የአሁኑ ዳታ በደመና ላይ ባለው ይተካል። ይቀጥሉ?")) return;

      const DB = SBM.DB;
      const changed = new Set();
      DB.sales = []; DB.expenses = []; DB.debtPayments = []; DB.stock = [];
      DB.credits = []; DB.creditHistory = {}; DB.vatInputs = {}; DB.monthlyReports = {};
      ["sales", "expenses", "debtPayments", "stock", "credits", "creditHistory", "vatInputs", "monthlyReports"].forEach((k) => changed.add(k));
      state.meta = {};
      let maxS = 0;
      const mref = await timed(metaRef().get());
      const resetAt = mref.exists ? (Number((mref.data() || {}).resetAt) || 0) : 0;
      snap.docs.forEach((doc) => {
        const x = doc.data() || {};
        const sMs = msOf(x.s);
        if (sMs > maxS) maxS = sMs;
        const t = typeOf(doc.id);
        if (x.x === true || !x.t || x.t !== t) return;
        let obj; try { obj = JSON.parse(x.d); } catch (e) { return; }
        if (APPEND_ONLY[t] && obj && Number(obj.id) <= resetAt) return;
        applyLocal(t, keyOf(doc.id), obj, changed);
        state.meta[doc.id] = fmtMeta(hashStr(x.d), sMs);
      });
      state.resetSeen = Math.max(state.resetSeen, resetAt);
      state.linked = true; state.lastPull = maxS; saveState();
      persistChanged(changed);
      toast("ዳታ ከደመና ተመልሷል! ✅");
    } catch (e) {
      console.warn("sync.js: manual restore failed", e);
      toast("ከደመና መመለስ አልተቻለም። ኢንተርኔት ያረጋግጡ።");

  }

  function status() {
    let pending = 0;
    try {
      const cur = collect();
      cur.forEach((v, id) => { const m = parseMeta(state.meta[id]); if (!m || m.h !== v.h) pending++; });
      Object.keys(state.meta).forEach((id) => { const m = parseMeta(state.meta[id]); if (m && m.h !== "x" && !cur.has(id)) pending++; });
    } catch (e) {}

      started, linked: !!state.linked, blocked, pending, lastSync: state.lastSync, cloudId,
      online: (typeof navigator === "undefined") ? true : navigator.onLine !== false,
      sdk: !!(global.firebase && global.firebase.firestore),
      ready, failCount, retryInMs: Math.max(0, nextAllowedAt - Date.now()),

  function applyNewItem(name, unit, bulkUnit, bulkConversion, qty, buy) {
    let ex = DB.stock.find((i) => i.name.trim().toLowerCase() === name.toLowerCase());
    if (ex) {
      ex.qty += qty;
      if (!ex.batches) ex.batches = [];
      ex.batches.push({ qty, buyPrice: buy });
      ex.buyPrice = buy;
      if (!ex.unit) ex.unit = unit;
      if (!ex.bulkUnit) { ex.bulkUnit = bulkUnit; ex.bulkConversion = bulkConversion; }

    SBM.database.save("stock");
