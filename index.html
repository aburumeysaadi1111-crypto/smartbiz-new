    const pendRows = pend.length === 0 ? '<tr><td colspan="2" style="text-align:center;">ምንም በመጠባበቅ ላይ ያለ ጥያቄ የለም</td></tr>'
      : pend.map((r) => `<tr><td><small>${escapeHTML(r.date)}</small><br><small>👤 ${escapeHTML(r.by)}</small><br>${kindTxt(r)}<br><b>${escapeHTML(r.desc)}</b><br><small>ጠቅላላ፦ ${Number(r.total || 0).toFixed(2)} ETB</small></td>
        <td class="action-btns" style="flex-direction:column;"><button class="btn-success" onclick="SBM.stock.approveRequest(${Number(r.id)})">✔ ፍቀድ</button><button class="btn-danger" onclick="SBM.stock.rejectRequest(${Number(r.id)})">✖ ከልክል</button></td></tr>`).join("");
    const doneRows = done.map((r) => `<tr><td><small>${escapeHTML(r.date)} · 👤 ${escapeHTML(r.by)}</small><br>${escapeHTML(r.desc)}</td>
      <td style="color:${r.status === "approved" ? "#28a745" : "#dc3545"};">${r.status === "approved" ? "✅ ተፈቅዷል" : "❌ ተከልክሏል"}${r.note ? "<br><small>" + escapeHTML(r.note) + "</small>" : ""}</td></tr>`).join("");
    return `<div class="summary-box"><b>${pend.length} በመጠባበቅ ላይ</b></div>
      <table><tbody>${pendRows}</tbody></table>
      ${doneRows ? `<h4 style="margin-top:14px;">የቅርብ ውሳኔዎች</h4><table><tbody>${doneRows}</tbody></table>` : ""}`;
  }

  function approveRequest(id) {
    if (!SBM.utils.requireAdmin()) return;
    const r = (DB.stockRequests || []).find((x) => Number(x.id) === Number(id));
    if (!r || r.status !== "pending") return;
    if (r.kind === "new") {
      applyNewItem(r.name, r.unit, r.bulkUnit, r.bulkConversion, Number(r.qty), Number(r.buy));
    } else if (!applyRestock(r.itemId, Number(r.qty), Number(r.unitPrice))) {
      return alert("ይህ እቃ ከስቶክ ተሰርዟል፤ ጭነቱን መጨመር አይቻልም።");
    }
    r.status = "approved"; r.decidedBy = SBM.auth.currentName(); r.decidedDate = SBM.utils.getEthDateStr();
    SBM.database.save("stockRequests");
    showToast("ተፈቅዷል፤ ስቶክ ተጨምሯል ✅");
    SBM.app.renderDashboardMenu();
    SBM.app.openPage("stockRequests");
  }

  function rejectRequest(id) {
    if (!SBM.utils.requireAdmin()) return;
    const r = (DB.stockRequests || []).find((x) => Number(x.id) === Number(id));
    if (!r || r.status !== "pending") return;
    const note = prompt("የመከልከል ምክንያት (አማራጭ)፡", "");
    if (note === null) return;
    r.status = "rejected"; r.note = note.trim(); r.decidedBy = SBM.auth.currentName(); r.decidedDate = SBM.utils.getEthDateStr();
    SBM.database.save("stockRequests");
    showToast("ተከልክሏል ❌");
    SBM.app.renderDashboardMenu();
    SBM.app.openPage("stockRequests");
  }

  /** ሰራተኛው የራሱን የጥያቄዎች ሁኔታ ያያል */
  function myRequestsHTML() {
    const me = SBM.auth.currentName();
    const mine = (DB.stockRequests || []).filter((r) => r.by === me).slice(-6).reverse();
    if (mine.length === 0) return "";
    const st = (r) => (r.status === "pending" ? "⏳ በመጠባበቅ" : r.status === "approved" ? "✅ ተፈቅዷል" : "❌ ተከልክሏል" + (r.note ? " (" + escapeHTML(r.note) + ")" : ""));
    return `<h4 style="margin-top:14px;">የእኔ ጥያቄዎች</h4><table><tbody>${mine.map((r) => `<tr><td><small>${escapeHTML(r.date)}</small><br>${escapeHTML(r.desc)}</td><td>${st(r)}</td></tr>`).join("")}</tbody></table>`;
  }

  function add() {
    if (!SBM.auth.getSession()) return;
    const name = (document.getElementById("stkName").value || "").trim();
    const type = document.getElementById("stkPurchaseType").value;
    if (!name) return alert("እባክዎን የዕቃ ስም ያስገቡ!");

    if (type === "quintal") {
      const kgPerQuintal = parseFloat(document.getElementById("stkQuintalKg").value) || 100;
      const count = parseFloat(document.getElementById("stkQuintalCount").value) || 0;
      const price = parseFloat(document.getElementById("stkQuintalPrice").value) || 0;
      if (count <= 0 || price <= 0) return alert("እባክዎን ትክክለኛ የኩንታል ብዛት እና ዋጋ ያስገቡ!");
      const totalSmall = count * kgPerQuintal;
      const unitPrice = (count * price) / totalSmall;
      saveItem(name, "ኪሎ", "ኩንታል", kgPerQuintal, totalSmall, unitPrice);

    } else if (type === "carton") {
      const pieces = parseFloat(document.getElementById("stkCartonPieces").value) || 0;
      const count = parseFloat(document.getElementById("stkCartonCount").value) || 0;
      const price = parseFloat(document.getElementById("stkCartonPrice").value) || 0;
      if (pieces <= 0) return alert("ካርቶኑ ስንት ፍሬ እንደሚይዝ ያስገቡ!");
      if (count <= 0 || price <= 0) return alert("እባክዎን ትክክለኛ የካርቶን ብዛት እና ዋጋ ያስገቡ!");
      const totalSmall = count * pieces;
      const unitPrice = (count * price) / totalSmall;
      saveItem(name, "ፍሬ", "ካርቶን", pieces, totalSmall, unitPrice);

    } else if (type === "dozen") {
      const count = parseFloat(document.getElementById("stkDozenCount").value) || 0;
      const price = parseFloat(document.getElementById("stkDozenPrice").value) || 0;
      if (count <= 0 || price <= 0) return alert("እባክዎን ትክክለኛ የደርዘን ብዛት እና ዋጋ ያስገቡ!");
      const totalSmall = count * 12;
      const unitPrice = (count * price) / totalSmall;
      saveItem(name, "ፍሬ", "ደርዘን", 12, totalSmall, unitPrice);

    } else if (type === "crate") {
      const pieces = parseFloat(document.getElementById("stkCratePieces").value) || 0;
      const count = parseFloat(document.getElementById("stkCrateCount").value) || 0;
      const price = parseFloat(document.getElementById("stkCratePrice").value) || 0;
      if (pieces <= 0) return alert("ካሳው ስንት ፍሬ እንደሚይዝ ያስገቡ!");
      if (count <= 0 || price <= 0) return alert("እባክዎን ትክክለኛ የካሳ ብዛት እና ዋጋ ያስገቡ!");
      const totalSmall = count * pieces;
      const unitPrice = (count * price) / totalSmall;
      saveItem(name, "ፍሬ", "ካሳ", pieces, totalSmall, unitPrice);

    } else if (type === "liter" || type === "meter" || type === "kgpack") {
      const pre = type === "liter" ? "stkLiter" : type === "meter" ? "stkMeter" : "stkKgpack";
      const base = type === "liter" ? "ሊትር" : type === "meter" ? "ሜትር" : "ኪሎ";
      const cont = (document.getElementById(pre + "Name").value || "").trim() || (type === "liter" ? "ጀሪካን" : type === "meter" ? "ጥቅል" : "ከረጢት");
      const per = parseFloat(document.getElementById(pre + "Per").value) || 0;
      const count = parseFloat(document.getElementById(pre + "Count").value) || 0;
      const price = parseFloat(document.getElementById(pre + "Price").value) || 0;
      if (per <= 0) return alert("አንዱ ስንት " + base + " እንደሚይዝ ያስገቡ!");
      if (count <= 0 || price <= 0) return alert("እባክዎን ትክክለኛ ብዛት እና ዋጋ ያስገቡ!");
      const totalSmall = count * per;
      const unitPrice = (count * price) / totalSmall;
      saveItem(name, base, cont, per, totalSmall, unitPrice);

    } else {
      const unit = (document.getElementById("stkPieceUnit").value || "").trim() || "ፍሬ";
      const qty = parseFloat(document.getElementById("stkPieceQty").value) || 0;
      const buy = parseFloat(document.getElementById("stkPiecePrice").value) || 0;
      if (qty <= 0 || buy <= 0) return alert("እባክዎን ትክክለኛ ብዛት እና ዋጋ ያስገቡ!");
      saveItem(name, unit, null, 1, qty, buy);
    }
  }

  function restock(id) {
    if (!SBM.auth.getSession()) return;
    const item = DB.stock.find((i) => i.id === id);
    if (!item) return;
    const bulkLabel = item.bulkUnit || item.unit || "ፍሬ";
    const conv = item.bulkConversion || 1;

    const count = parseFloat(prompt(`ለ "${item.name}" ስንት ${bulkLabel} ጨመሩ?`));
    if (!count || isNaN(count) || count <= 0) return;
    const price = parseFloat(prompt(`የአንዱ ${bulkLabel} ዋጋ (ETB) ስንት ነው?`));
    if (isNaN(price) || price <= 0) return alert("እባክዎን ትክክለኛ ዋጋ ያስገቡ!");

    const totalSmall = count * conv;
    const unitPrice = (count * price) / totalSmall;

    if (!SBM.auth.isAdmin()) {
      return createRequest({ kind: "restock", itemId: item.id, name: item.name, qty: totalSmall, unitPrice, total: count * price,
        desc: "ጭነት፦ " + item.name + " — " + count + " " + bulkLabel + " @ " + price + " ETB/" + bulkLabel });
    }
    applyRestock(item.id, totalSmall, unitPrice);
    showToast(`አዲስ ጭነት ተጨምሯል! (${Number(unitPrice).toFixed(2)} ETB/${escapeHTML(item.unit)})`);
    SBM.app.openPage("stock");
  }

  function edit(id) {
    if (!SBM.utils.requireAdmin()) return;
    const item = DB.stock.find((i) => i.id === id);
    if (!item) return;
    const nn = prompt("አዲስ የዕቃ ስም:", item.name);
    if (nn) {
      item.name = nn.trim();
      SBM.database.save("stock");
      showToast("መረጃው ተስተካክሏል!");
      SBM.app.openPage("stock");
    }
  }

  function remove(id) {
    if (!SBM.utils.requireAdmin()) return;
    if (confirm("እርግጠኛ ነዎት ይህ እቃ ይሰረዝ?")) {
      DB.stock = DB.stock.filter((i) => i.id !== id);
      SBM.database.save("stock");
      showToast("እቃው ተሰርዟል!");
      SBM.app.openPage("stock");
    }
  }

  global.SBM = global.SBM || {};
  function lastBuy(item) {
    return (item.batches && item.batches.length) ? Number(item.batches[item.batches.length - 1].buyPrice || 0) : Number(item.buyPrice || 0);
  }

  /** በመደርደሪያ ላይ የተቆጠረውን ብዛት ከሲስተሙ ጋር ለማነጻጸር (አድሚን ብቻ)። ባዶ የተተወ እቃ አይቆጠርም። */
  function renderCountUI() {
    if (!SBM.utils.requireAdmin()) return "";
    const list = DB.stock || [];
    const rows = list.length === 0
      ? '<tr><td colspan="3" style="text-align:center;">ምንም ዕቃ አልተመዘገበም</td></tr>'
      : list.map((i) => `<tr><td><b>${escapeHTML(i.name)}</b></td><td>${i.qty} ${escapeHTML(i.unit || "ፍሬ")}</td>
          <td><input type="number" step="0.01" id="sc_${i.id}" placeholder="ብዛት" style="width:90px;"></td></tr>`).join("");
    const past = (DB.stockCounts || []).slice(-5).reverse().map((c) => {
      const short = c.lines.filter((l) => l.diff < 0).reduce((a, l) => a + Math.abs(l.value), 0);
      return `<tr><td><small>${escapeHTML(c.date)}</small><br><small>👤 ${escapeHTML(c.by || "")}</small></td><td>${c.lines.length} እቃ</td><td style="color:${short > 0 ? "#dc3545" : "green"};">${short > 0 ? "ጉድለት " + short.toFixed(2) + " ETB" : "ልዩነት የለም"}</td></tr>`;
    }).join("");
    return `<p style="font-size:12px;color:var(--secondary);margin-bottom:8px;">መደርደሪያ ላይ የቆጠሩትን ብዛት በትንሹ አሃድ (ኪሎ/ፍሬ) ያስገቡ። ያልቆጠሩትን ባዶ ይተዉ።</p>
      <div style="max-height:300px;overflow-y:auto;"><table><thead><tr><th>ዕቃ</th><th>በሲስተም</th><th>የተቆጠረ</th></tr></thead><tbody>${rows}</tbody></table></div>
      <label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px;"><input type="checkbox" id="scAdjust"> ስቶኩን ወደ ተቆጠረው ብዛት አስተካክል</label>
      <button class="btn-primary" style="padding:10px;font-weight:bold;" onclick="SBM.stock.submitCount()">🧮 አነጻጽር እና መዝግብ</button>
      ${past ? `<h4 style="margin-top:15px;">የቅርብ ቆጠራዎች</h4><table><tbody>${past}</tbody></table>` : ""}`;
  }

  function applyCountToItem(item, counted) {
    const diff = counted - item.qty;
    if (diff < 0) {
      let need = -diff;
      for (const b of (item.batches || [])) { if (need <= 0) break; const t = Math.min(need, b.qty); b.qty -= t; need -= t; }
      item.batches = (item.batches || []).filter((b) => b.qty > 0);
    } else if (diff > 0) {
      if (!item.batches) item.batches = [];
      item.batches.push({ qty: diff, buyPrice: lastBuy(item) });
    }
    item.qty = counted;
  }

  function submitCount() {
    if (!SBM.utils.requireAdmin()) return;
    const adjust = !!(document.getElementById("scAdjust") || {}).checked;
    const lines = [];
    (DB.stock || []).forEach((i) => {
      const el = document.getElementById("sc_" + i.id);
      if (!el || el.value === "") return;
      const counted = parseFloat(el.value);
      if (isNaN(counted) || counted < 0) return;
      const diff = Math.round((counted - i.qty) * 100) / 100;
      lines.push({ id: i.id, name: i.name, unit: i.unit || "ፍሬ", system: i.qty, counted, diff, value: Math.round(diff * lastBuy(i) * 100) / 100 });
    });
    if (lines.length === 0) return alert("ቢያንስ አንድ እቃ ቆጥረው ብዛቱን ያስገቡ!");
    if (adjust && !confirm("ስቶኩ ወደ ተቆጠረው ብዛት ይስተካከላል። ይቀጥሉ?")) return;
    if (adjust) {
      lines.forEach((l) => { const it = DB.stock.find((x) => x.id === l.id); if (it) applyCountToItem(it, l.counted); });
      SBM.database.save("stock");
    }
    if (!Array.isArray(DB.stockCounts)) DB.stockCounts = [];
    DB.stockCounts.push({ id: Date.now(), date: SBM.utils.getEthDateStr(), by: SBM.auth.currentName(), adjusted: adjust,
      lines: lines.map((l) => ({ name: l.name, unit: l.unit, system: l.system, counted: l.counted, diff: l.diff, value: l.value })) });
    SBM.database.save("stockCounts");

    const short = lines.filter((l) => l.diff < 0).reduce((a, l) => a + Math.abs(l.value), 0);
    const over = lines.filter((l) => l.diff > 0).reduce((a, l) => a + l.value, 0);
    const rows = lines.map((l) => `<tr><td><b>${escapeHTML(l.name)}</b></td><td>${l.system}</td><td>${l.counted}</td>
      <td style="font-weight:bold;color:${l.diff < 0 ? "#dc3545" : l.diff > 0 ? "#28a745" : "inherit"};">${l.diff > 0 ? "+" : ""}${l.diff} ${escapeHTML(l.unit)}</td></tr>`).join("");
    document.getElementById("modalTitle").innerText = "🧮 የቆጠራ ውጤት";
    document.getElementById("modalBody").innerHTML = `
      <div class="summary-box"><p>📉 ጉድለት (በመግዣ ዋጋ): <b style="color:#dc3545;">${short.toFixed(2)} ETB</b></p>
      <p>📈 ትርፍ ብዛት: <b style="color:#28a745;">${over.toFixed(2)} ETB</b></p>
      <p style="font-size:12px;">${adjust ? "✅ ስቶኩ ተስተካክሏል።" : "ስቶኩ አልተስተካከለም (ማነጻጸሪያ ብቻ)።"}</p></div>
      <div style="max-height:300px;overflow-y:auto;"><table><thead><tr><th>ዕቃ</th><th>በሲስተም</th><th>የተቆጠረ</th><th>ልዩነት</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn-secondary" style="flex:1;" onclick="SBM.app.openPage('stockCount')">⬅ ተመለስ</button>
        <button class="btn-primary" style="flex:1;" onclick="SBM.app.printModalContent()">🖨️ አትም</button></div>`;
  }

  global.SBM.stock = { onCategoryChange, renderRequestsUI, approveRequest, rejectRequest, pendingRequestCount, renderCountUI, submitCount, renderUI, togglePurchaseType, generateRows, filter, add, restock, edit, remove, formatQty };
})(window);

// ==== sales.js ====
/**
 * sales.js — POS (መሸጫ) + FIFO Session Snapshot
 *
 * posSessionBatches ከ DB.stock[].batches ተነጥሎ የሚቀመጥ "የክፍለ-ጊዜ ቅጂ" (snapshot)
 * ነው። ይህ የሆነው ካርቱ ውስጥ ያሉ ዕቃዎች ትርፍ ሲሰላ፣ ገና ካልተሸጠ/ካልተረጋገጠ ስቶክ ላይ
 * ተመስርቶ እንዳይዛባ ለመከላከል ነው (ከዚህ በፊት የነበረ የትርፍ ስሌት ጉድለት መፍትሔ)።
 *
 * 🔧 FIX (ኪሎ/ፍሬ ምርጫ አለመስራት)፦
 * ከዚህ በፊት updateUnitChoices() በእያንዳንዱ ጥሪ (ጅምላ/ትንሽ አሃድ dropdown ራሱ
 * onchange ሲደረግም ጨምሮ) የ #posUnitChoice ውስጡን (innerHTML) ደግሞ ይገነባው
 * ነበር። ይሄ ደግሞ ተጠቃሚው የመረጠውን "ትንሽ አሃድ" (ኪሎ/ፍሬ) ወዲያውኑ ወደ "ጅምላ"
 * (ኩንታል/ካርቶን/ደርዘን) ይመልሰው ነበር — ስለዚህ ኪሎ/ፍሬ የመረጠ ሁሉ በተግባር ጅምላውኑ
 * ብቻ ይሸጥ ነበር። አሁን dropdown ውስጡ የሚገነባው ዕቃው ራሱ ሲቀየር ብቻ ነው
 * (data-item-id ተጠቅመን እንከታተላለን) — የተጠቃሚው ምርጫ (ኪሎ/ፍሬ) ስለዚህ ይቆያል።
 */
(function (global) {
  "use strict";
  const { DB } = SBM;
  const { escapeHTML, showToast, getEthDateStr, getCurrentEthYMD, renderEthiopicDatePickerHTML, getSelectedEthDateValue } = SBM.utils;

  let posCart = [];
  let posSessionBatches = {};

  const BANKS = ["ንግድ ባንክ (CBE)", "ዘምዘም ባንክ", "አቢሲንያ ባንክ", "ዳሽን ባንክ", "አዋሽ ባንክ", "ኦሮሚያ ባንክ", "ወጋገን ባንክ", "ንብ ባንክ", "ቡና ባንክ", "ኅብረት ባንክ", "ቴሌብር", "CBE Birr", "ሌላ"];
  function bankSelectHTML(selId, otherId) {
    return `<select id="${selId}" onchange="document.getElementById('${otherId}').classList.toggle('hidden', this.value !== 'ሌላ')">
      <option value="">— ባንክ ይምረጡ —</option>${BANKS.map((b) => `<option value="${escapeHTML(b)}">${escapeHTML(b)}</option>`).join("")}</select>
      <input type="text" id="${otherId}" class="hidden" style="margin-top:6px;" placeholder="የባንኩን ስም ይጻፉ">`;
  }
  /** የተመረጠውን ባንክ ስም ይመልሳል ("ሌላ" ከሆነ የተጻፈውን)። ካልተመረጠ "" */
  function readBank(selId, otherId) {
    const sel = document.getElementById(selId);
    if (!sel || !sel.value) return "";
    if (sel.value === "ሌላ") { const o = document.getElementById(otherId); return o ? o.value.trim() : ""; }
    return sel.value;
  }

  function resetSession() {
    posCart = [];
    posSessionBatches = {};
  }

  function getSessionBatches(item) {
    if (!posSessionBatches[item.id]) {
      posSessionBatches[item.id] = (item.batches && item.batches.length)
        ? JSON.parse(JSON.stringify(item.batches))
        : [{ qty: item.qty, buyPrice: item.buyPrice || 0 }];
    }
    return posSessionBatches[item.id];
  }

  function renderUI() {
    const list = DB.stock || [];
    // formatQty() (from stock.js) shows both units at once when the item has a
    // bulk grouping — e.g. "995 ኪሎ (9 ኩንታል ከ95 ኪሎ ቀሪ)" — so the seller can see
    // the stock the same way whether they think in small units or bulk units.
    const opts = list.length === 0
      ? '<option value="">ምንም እቃ በስቶክ ውስጥ የለም</option>'
      : list.map((i) => {
          const bulkLabel = (i.bulkUnit && (i.bulkConversion || 1) > 1)
            ? ` (${SBM.stock.formatQty(i)})`
            : "";
          return `<option value="${i.id}">${escapeHTML(i.name)} (ቀሪ: ${i.qty} ${escapeHTML(i.unit || "ፍሬ")}${bulkLabel})</option>`;
        }).join("");
    return `
      <div style="border:1px solid var(--border);padding:10px;border-radius:10px;margin-bottom:12px;">
        <div class="form-group"><label>ዕቃ መምረጫ</label><select id="posItemSelect" onchange="SBM.sales.onItemChange()">${opts}</select></div>
        <div class="form-group hidden" id="posUnitChoiceGroup"><label>በምን መልኩ ይሸጣል?</label><select id="posUnitChoice" onchange="SBM.sales.onUnitChoiceChange()"></select></div>
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1"><label id="posQtyLabel">ብዛት</label><input type="number" id="posQty" value="1" step="0.01"></div>
          <div class="form-group" style="flex:1"><label id="posPriceLabel">የአንዱ መሸጫ ዋጋ (ETB)</label><input type="number" id="posSellPrice" placeholder="ዋጋ ያስገቡ"></div>
        </div>
        <button class="btn-success" style="width:100%;padding:10px;font-weight:bold;" onclick="SBM.sales.addToCart()">+ እቃውን ወደ ዝርዝር ጨምር</button>
      </div>
      <h4>🛒 የተመረጡ እቃዎች ዝርዝር</h4>
      <div style="max-height:150px;overflow-y:auto;margin:8px 0;">
        <table><thead><tr><th>እቃ</th><th>ብዛት</th><th>ዋጋ</th><th>ድምር</th><th></th></tr></thead>
        <tbody id="cartTableBody"><tr><td colspan="5" style="text-align:center;">ምንም እቃ አልተመረጠም</td></tr></tbody></table>
      </div>
      <div style="background:rgba(10,94,176,.05);padding:10px;border-radius:8px;margin:10px 0;text-align:right;">
        <div style="font-size:13px;color:var(--secondary);">ንኡስ ድምር: <span id="cartSubtotal">0.00</span> ETB</div>
        <div id="cartVatRow" style="font-size:13px;color:var(--secondary);${DB.vatEnabled ? "" : "display:none;"}">ቫት 15%: <span id="cartVatAmount">0.00</span> ETB</div>
        <div style="font-weight:bold;font-size:16px;margin-top:4px;">${DB.vatEnabled ? "ጠቅላላ ክፍያ ከቫት ጋር" : "ጠቅላላ ክፍያ"}: <span id="cartGrandTotal" style="color:#0A5EB0;">0.00 ETB</span></div>
      </div>
      <div class="form-group"><label>የክፍያ ሁኔታ</label>
        <select id="posPayMode" onchange="SBM.sales.toggleCreditFields(this.value)">
          <option value="cash">💵 ሙሉ በሙሉ በካሽ</option>
          <option value="bank">🏦 ሙሉ በሙሉ በባንክ</option>
          <option value="credit">💳 ሙሉ በሙሉ በዱቤ</option>
          <option value="mixed">🌗 የተቀላቀለ (ካሽ / ባንክ / ዱቤ)</option>
        </select>
      </div>
      <div id="posMixedGroup" class="hidden">
        <div style="display:flex;gap:10px;">
          <div class="form-group" style="flex:1"><label>💵 በካሽ የከፈለው (ETB)</label><input type="number" id="posMixCash" value="0" step="0.01" oninput="SBM.sales.updateMixedRemainder()"></div>
          <div class="form-group" style="flex:1"><label>🏦 በባንክ የከፈለው (ETB)</label><input type="number" id="posMixBank" value="0" step="0.01" oninput="SBM.sales.updateMixedRemainder()"></div>
        </div>
        <div id="posMixRemainder" style="font-size:13px;font-weight:bold;margin-bottom:10px;">💳 ቀሪ በዱቤ: 0.00 ETB</div>
      </div>
      <div id="posBankGroup" class="hidden">
        <div class="form-group"><label>🏦 ደንበኛው የላከበት ባንክ (ግዴታ — ለኦዲት)</label>${bankSelectHTML("posBankName", "posBankOther")}</div>
        <div class="form-group"><label>የማስተላለፊያ ማጣቀሻ ቁጥር (አማራጭ)</label><input type="text" id="posBankRef" placeholder="ምሳሌ፡ FT2610..."></div>
      </div>
      <div id="posCreditGroup" class="hidden">
        <div class="form-group"><label>የደንበኛው ስም (ለዱቤ ግዴታ ነው)</label><input type="text" id="posCustomerName" placeholder="የደንበኛ ስም ያስገቡ"></div>
        <div class="form-group"><label>የሚከፈልበት ቀን (የኢትዮጵያ ካላንደር)</label>${renderEthiopicDatePickerHTML("posDue")}</div>
      </div>
      <button class="btn-primary" style="padding:12px;font-weight:bold;" onclick="SBM.sales.processSale()">✔ ሽያጭ ፈጽም${DB.vatEnabled ? " (ከቫት ጋር)" : ""}</button>`;
  }

  /**
   * ዕቃው (posItemSelect) ሲቀየር ብቻ ይጠራል። እዚህ ብቻ ነው #posUnitChoice ውስጡ
   * እንደገና የሚገነባው (ወደ "ጅምላ" default ተመልሶ) — ምክንያቱም አዲስ ዕቃ ሲመረጥ
   * ከዚህ ቀደም የነበረው ምርጫ (ኪሎ/ፍሬ) ለአዲሱ ዕቃ ትርጉም ስለሌለው።
   */
  function onItemChange() {
    const unitSel = document.getElementById("posUnitChoice");
    if (unitSel) delete unitSel.dataset.itemId; // ግድ አድርገው dropdown እንደገና እንዲገነባ
    updateUnitChoices();
  }

  /**
   * "ጅምላ/ትንሽ አሃድ" dropdown ራሱ ሲቀየር ይጠራል። እዚህ ውስጡ (innerHTML) በጭራሽ
   * አይነካካም — ስለዚህ ተጠቃሚው የመረጠው (ኪሎ/ፍሬ) አይጠፋም። ሌብሎችን ብቻ ነው የምናድሰው።
   */
  function onUnitChoiceChange() {
    updateLabelsOnly();
  }

  function updateLabelsOnly() {
    const sel = document.getElementById("posItemSelect");
    const unitSel = document.getElementById("posUnitChoice");
    const qtyLabel = document.getElementById("posQtyLabel");
    const priceLabel = document.getElementById("posPriceLabel");
    if (!sel || !sel.value || !unitSel) return;
    const item = DB.stock.find((i) => i.id === parseFloat(sel.value));
    if (!item) return;
    const chosen = unitSel.value === "small" ? "small" : "bulk";
    const label = chosen === "bulk" ? (item.bulkUnit || item.unit) : item.unit;
    qtyLabel.innerText = `ብዛት (በ${label})`;
    priceLabel.innerText = `የአንዱ ${label} መሸጫ ዋጋ (ETB)`;
  }

  function updateUnitChoices() {
    const sel = document.getElementById("posItemSelect");
    const group = document.getElementById("posUnitChoiceGroup");
    const unitSel = document.getElementById("posUnitChoice");
    const qtyLabel = document.getElementById("posQtyLabel");
    const priceLabel = document.getElementById("posPriceLabel");
    if (!sel || !sel.value) { group.classList.add("hidden"); return; }
    const item = DB.stock.find((i) => i.id === parseFloat(sel.value));
    if (!item) { group.classList.add("hidden"); return; }

    if (item.bulkUnit && (item.bulkConversion || 1) > 1) {
      group.classList.remove("hidden");
      // dropdown ውስጡን የምንገነባው ዕቃው ከቀደመው ጊዜ ተቀይሮ ከሆነ ብቻ ነው (data-item-id
      // via onItemChange) — ስለዚህ በራሱ dropdown ምርጫ (onUnitChoiceChange)
      // ምክንያት እንደገና አይገነባም/አይጠፋም።
      if (unitSel.dataset.itemId !== String(item.id)) {
        unitSel.innerHTML = `<option value="bulk">${escapeHTML(item.bulkUnit)}</option><option value="small">${escapeHTML(item.unit)}</option>`;
        unitSel.value = "bulk";
        unitSel.dataset.itemId = String(item.id);
      }
      const chosen = unitSel.value === "small" ? "small" : "bulk";
      const label = chosen === "bulk" ? item.bulkUnit : item.unit;
      qtyLabel.innerText = `ብዛት (በ${label})`;
      priceLabel.innerText = `የአንዱ ${label} መሸጫ ዋጋ (ETB)`;
    } else {
      group.classList.add("hidden");
      if (unitSel) delete unitSel.dataset.itemId;
      qtyLabel.innerText = `ብዛት (በ${item.unit || "ፍሬ"})`;
      priceLabel.innerText = `የአንዱ ${item.unit || "ፍሬ"} መሸጫ ዋጋ (ETB)`;
    }
  }

  function addToCart() {
    const sel = document.getElementById("posItemSelect");
    if (!sel || !sel.value) return alert("እባክዎን መጀመሪያ እቃ ይምረጡ!");
    const id = parseFloat(sel.value);
    const enteredQty = parseFloat(document.getElementById("posQty").value) || 0;
    const enteredSell = parseFloat(document.getElementById("posSellPrice").value) || 0;
    const item = DB.stock.find((i) => i.id === id);
    if (!item || enteredQty <= 0) return alert("ትክክለኛ ብዛት ያስገቡ!");
    if (enteredSell <= 0) return alert("እባክዎን የመሸጫ ዋጋ ያስገቡ!");

    const unitChoiceEl = document.getElementById("posUnitChoice");
    const useBulk = item.bulkUnit && !document.getElementById("posUnitChoiceGroup").classList.contains("hidden") && unitChoiceEl && unitChoiceEl.value === "bulk";
    const conv = useBulk ? (item.bulkConversion || 1) : 1;
    const displayUnit = useBulk ? item.bulkUnit : (item.unit || "ፍሬ");

    const qty = enteredQty * conv;           // small-unit quantity, used for stock/FIFO
    const sell = enteredSell / conv;         // per-small-unit sell price, used for FIFO profit math

    const curQty = posCart.filter((c) => c.id === id).reduce((s, c) => s + c.qty, 0);
    if (item.qty < curQty + qty) return alert("በስቶክ ውስጥ በቂ እቃ የለም! (ቀሪ: " + (item.qty - curQty) + " " + escapeHTML(item.unit || "ፍሬ") + ")");

    const sb = getSessionBatches(item);
    let need = qty, profit = 0;
    for (const b of sb) {
      if (b.qty > 0 && need > 0) {
        const take = Math.min(need, b.qty);
        profit += (sell - b.buyPrice) * take;
        b.qty -= take;
        need -= take;
      }
    }
    if (profit < -0.005) {
      const ok = confirm("⚠️ ማስጠንቀቂያ፦ ይህ የመሸጫ ዋጋ ከመግዣ ዋጋ በታች ነው!\nኪሳራ፦ " + Math.abs(profit).toFixed(2) + " ETB\n\nቢሆንም ይቀጥሉ? (ሽያጩ «ከመግዣ በታች» ተብሎ ከስምዎ ጋር ይመዘገባል)");
      if (!ok) {
        delete posSessionBatches[item.id];
        recomputeProfitsForItem(item.id);
        return;
      }
    }
    posCart.push({
      cartLineId: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      id: item.id, name: item.name, qty, sellPrice: sell, subtotal: enteredQty * enteredSell, profit,
      displayQty: enteredQty, displayUnit, displaySellPrice: enteredSell, convFactor: conv,
    });
    document.getElementById("posSellPrice").value = "";
    document.getElementById("posQty").value = "1";
    updateCartTable();
  }

  function recomputeProfitsForItem(itemId) {
    const item = DB.stock.find((i) => i.id === itemId);
    if (!item) return;
    delete posSessionBatches[itemId];
    const sb = getSessionBatches(item);
    posCart.filter((c) => c.id === itemId).forEach((line) => {
      let need = line.qty, pr = 0;
      for (const b of sb) {
        if (b.qty > 0 && need > 0) {
          const take = Math.min(need, b.qty);
          pr += (line.sellPrice - b.buyPrice) * take;
          b.qty -= take;
          need -= take;
        }
      }
      line.profit = pr;
    });
  }

  function editCartLine(lid) {
    const line = posCart.find((c) => c.cartLineId === lid);
    if (!line) return;
    const item = DB.stock.find((i) => i.id === line.id);
    const unitLabel = line.displayUnit || "";

    const newQtyStr = prompt(`"${line.name}" ብዛት በ${unitLabel} (አሁን ${line.displayQty}) ብትቀይሩ አዲስ ብዛት ያስገቡ፡`, line.displayQty);
    if (newQtyStr === null) return;
    const newDisplayQty = parseFloat(newQtyStr);
    if (isNaN(newDisplayQty) || newDisplayQty <= 0) return alert("ትክክለኛ ብዛት ያስገቡ!");

    const newPriceStr = prompt(`"${line.name}" የ${unitLabel} መሸጫ ዋጋ (አሁን ${line.displaySellPrice}) ብትቀይሩ አዲስ ዋጋ ያስገቡ፡`, line.displaySellPrice);
    if (newPriceStr === null) return;
    const newDisplayPrice = parseFloat(newPriceStr);
    if (isNaN(newDisplayPrice) || newDisplayPrice <= 0) return alert("ትክክለኛ ዋጋ ያስገቡ!");

    const conv = line.convFactor || 1;
    const newQty = newDisplayQty * conv;
    const newPrice = newDisplayPrice / conv;

    if (item) {
      const otherQty = posCart.filter((c) => c.id === line.id && c.cartLineId !== lid).reduce((s, c) => s + c.qty, 0);
      if (item.qty < otherQty + newQty) {
        return alert("በስቶክ ውስጥ በቂ እቃ የለም! (ቀሪ: " + (item.qty - otherQty) + " " + escapeHTML(item.unit || "ፍሬ") + ")");
      }
    }

    const old = { qty: line.qty, sellPrice: line.sellPrice, displayQty: line.displayQty, displaySellPrice: line.displaySellPrice, subtotal: line.subtotal };
    line.qty = newQty;
    line.sellPrice = newPrice;
    line.displayQty = newDisplayQty;
    line.displaySellPrice = newDisplayPrice;
    line.subtotal = newDisplayQty * newDisplayPrice;
    recomputeProfitsForItem(line.id);
    if (line.profit < -0.005 && !confirm("⚠️ ማስጠንቀቂያ፦ ይህ የመሸጫ ዋጋ ከመግዣ ዋጋ በታች ነው!\nኪሳራ፦ " + Math.abs(line.profit).toFixed(2) + " ETB\n\nቢሆንም ይቀጥሉ?")) {
      Object.assign(line, old);
      recomputeProfitsForItem(line.id);
      return;
    }
    updateCartTable();

  function removeFromCart(lid) {

    posCart = posCart.filter((c) => c.cartLineId !== lid);
    if (removed) {
      const item = DB.stock.find((i) => i.id === removed.id);
      if (item) {
        // Recompute profit for remaining lines of this item from a fresh
        // snapshot, so removing a line never leaves stale batch state behind.
        delete posSessionBatches[removed.id];
        const sb = getSessionBatches(item);
        posCart.filter((c) => c.id === removed.id).forEach((line) => {
          let need = line.qty, pr = 0;
          for (const b of sb) {
            if (b.qty > 0 && need > 0) {
              const take = Math.min(need, b.qty);
              pr += (line.sellPrice - b.buyPrice) * take;

              need -= take;

        });

          <button class="btn-danger" onclick="SBM.sales.removeFromCart('${c.cartLineId}')">❌</button>
        </td></tr>`;
    }).join("");
    const vat = DB.vatEnabled ? sub * 0.15 : 0;
    sE.innerText = sub.toFixed(2); vE.innerText = vat.toFixed(2); gE.innerText = (sub + vat).toFixed(2) + " ETB";
    updateMixedRemainder();
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

  function currentGrand() {
    const sub = posCart.reduce((s, c) => s + c.subtotal, 0);
    return sub + (DB.vatEnabled ? sub * 0.15 : 0);
  }

  function setHidden(id, hidden) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("hidden", hidden);
  }

  /** የክፍያ ሁኔታ ሲቀየር የሚታዩ ሳጥኖችን ይቀይራል (ካሽ/ባንክ/ዱቤ/የተቀላቀለ)። */
  function toggleCreditFields(mode) {
    setHidden("posMixedGroup", mode !== "mixed");
    setHidden("posBankGroup", !(mode === "bank" || mode === "mixed"));
    setHidden("posCreditGroup", !(mode === "credit" || mode === "mixed"));
    updateMixedRemainder();
  }

  /** በ"የተቀላቀለ" ክፍያ፦ ካሽ እና ባንክ ከተጻፈ በኋላ የሚቀረው ራሱ በዱቤ ይሰላል። */
  function updateMixedRemainder() {
    const el = document.getElementById("posMixRemainder");
    if (!el) return;
    const cash = Math.max(0, parseFloat((document.getElementById("posMixCash") || {}).value) || 0);
    const bank = Math.max(0, parseFloat((document.getElementById("posMixBank") || {}).value) || 0);
    const rem = round2(currentGrand() - cash - bank);
    if (rem < 0) {
      el.style.color = "#dc3545";
      el.innerText = "⚠️ ካሽ + ባንክ ከጠቅላላ ክፍያ በላይ ነው!";
    } else {
      el.style.color = "";
      el.innerText = "💳 ቀሪ በዱቤ: " + rem.toFixed(2) + " ETB";
    }
  }

  function processSale() {
    if (posCart.length === 0) return alert("እባክዎን መጀመሪያ እቃዎችን ወደ ዝርዝር ይጨምሩ!");
    const payMode = document.getElementById("posPayMode").value;
    const sub = posCart.reduce((s, c) => s + c.subtotal, 0);
    const vat = DB.vatEnabled ? sub * 0.15 : 0;
    const grand = sub + vat;
    const profit = posCart.reduce((s, c) => s + c.profit, 0);
    const cn = document.getElementById("posCustomerName") ? document.getElementById("posCustomerName").value.trim() : "";
    const bankRefEl = document.getElementById("posBankRef");
    const bankRefInput = bankRefEl ? bankRefEl.value.trim() : "";
    const bankNameInput = readBank("posBankName", "posBankOther");

    // ክፍያውን በካሽ / ባንክ / ዱቤ መከፋፈል
    let cash = 0, bank = 0, credit = 0;
    if (payMode === "cash") {
      cash = grand;
    } else if (payMode === "bank") {
      bank = grand;
    } else if (payMode === "credit") {
      credit = grand;
    } else if (payMode === "mixed") {
      cash = parseFloat(document.getElementById("posMixCash").value) || 0;
      bank = parseFloat(document.getElementById("posMixBank").value) || 0;
      if (cash < 0 || bank < 0) return alert("የገንዘብ መጠን ከ0 በታች መሆን አይችልም!");
      if (cash + bank > grand + 0.005) return alert("ካሽ + ባንክ ከጠቅላላ ክፍያ በላይ መሆን አይችልም!");
      credit = round2(grand - cash - bank);
      if (credit < 0.005) credit = 0;
    } else {
      return alert("እባክዎን የክፍያ ሁኔታ ይምረጡ!");
    }

    if (bank > 0 && !bankNameInput) return alert("በባንክ ለተከፈለ ክፍያ ደንበኛው የላከበትን ባንክ መምረጥ ግዴታ ነው!");
    if (credit > 0 && !cn) return alert("ለዱቤ የደንበኛውን ስም ማስገባት ግዴታ ነው!");
    let dueDate = "";
    if (credit > 0) dueDate = getSelectedEthDateValue("posDue") || getCurrentEthYMD();

    // Commit stock reductions against REAL stock (not the session snapshot).
    posCart.forEach((ci) => {
      const si = DB.stock.find((s) => s.id === ci.id);
      if (!si) return;
      let q = ci.qty;
      si.qty = Math.max(0, (si.qty || 0) - q);
      if (si.batches) {
        for (const b of si.batches) {
          if (b.qty > 0 && q > 0) {
            const take = Math.min(q, b.qty);
            b.qty -= take; q -= take;
            if (q <= 0) break;
          }
        }
        si.batches = si.batches.filter((b) => b.qty > 0);
      }
    });

    const summary = posCart.map((c) => `${c.name} (x${c.displayQty}${c.displayUnit || ""} @ ${c.displaySellPrice}ብር)`).join(", ");
    // የዱቤ መዝገብ የሚነካው ዱቤ ካለ ብቻ ነው። አሁን የተከፈለው (ካሽ + ባንክ) እንደ "የከፈለው" ይመዘገባል።
    if (credit > 0) {
      SBM.credit.recordTransaction(cn, credit >= grand - 0.005 ? "እቃ ወሰደ (በዱቤ)" : "እቃ ወሰደ (በከፊል ከፈለ)", summary, grand, cash + bank, dueDate);
    }
    DB.sales.push({
      id: Date.now(), items: [...posCart], summaryName: summary, subtotal: sub, vatAmount: vat,
      vatApplied: !!DB.vatEnabled,
      total: grand, cashAmount: cash, bankAmount: bank, creditAmount: credit,
      bankRef: bank > 0 ? bankRefInput : "",
      bankName: bank > 0 ? bankNameInput : "",
      seller: SBM.auth.currentName(),
      belowCost: posCart.some((c) => c.profit < -0.005),
      lossAmount: round2(posCart.reduce((a, c) => a + (c.profit < -0.005 ? -c.profit : 0), 0)),
      profit, date: getEthDateStr(),
      payMode, customer: cn || (payMode === "bank" ? "የባንክ ደንበኛ" : "የካሽ ደንበኛ"),
    });
    const lastSale = DB.sales[DB.sales.length - 1];
    if (lastSale.belowCost) {
      SBM.app.addAlert("belowCost", "ከመግዣ በታች ሸጠ፦ " + summary + " — ደንበኛ፡ " + lastSale.customer, lastSale.lossAmount);
    }
    SBM.database.save("stock");
    SBM.database.save("sales");
    resetSession();
    showToast("ሽያጭ በስኬት ተፈጽሟል!");
    SBM.app.closeModal();
  }

  global.SBM = global.SBM || {};
  global.SBM.sales = {
    renderUI, onItemChange, onUnitChoiceChange, addToCart, updateUnitChoices, removeFromCart, editCartLine, updateCartTable, toggleCreditFields, updateMixedRemainder, processSale,
    resetSession, getCart: () => posCart, BANKS, bankSelectHTML, readBank,
  };
})(window);

  /** የአንድን ወር ሁሉንም ቁጥሮች ከሽያጭ፣ ከዱቤ ክፍያ እና ከወጪ ያሰላል። */
  function computeMonth(y, mo) {
    let salesCash = 0, salesBank = 0, salesCredit = 0, salesTotal = 0, vat = 0, profit = 0, count = 0;
    const bySeller = {};
    (DB.sales || []).forEach((s) => {
      if (!inMonth(s.date, y, mo)) return;
      const p = saleParts(s);
      salesCash += p.cash; salesBank += p.bank; salesCredit += p.credit;
      salesTotal += Number(s.total || 0);
      vat += s.vatAmount !== undefined ? Number(s.vatAmount || 0) : (s.total ? Number(s.total) * 0.15 / 1.15 : 0);
      profit += Number(s.profit || 0);
      count += 1;
      const n = sellerName(s);
      if (!bySeller[n]) bySeller[n] = { count: 0, total: 0, cash: 0, bank: 0, credit: 0 };
      bySeller[n].count += 1;
      bySeller[n].total += Number(s.total || 0);
      bySeller[n].cash += p.cash; bySeller[n].bank += p.bank; bySeller[n].credit += p.credit;
    });
    const col = sumPayments(allDebtPayments().filter((p) => inMonth(p.date, y, mo)));
    const expenses = (DB.expenses || []).filter((e) => inMonth(e.date, y, mo)).reduce((s, e) => s + Number(e.amount || 0), 0);
    const totalCash = salesCash + col.cash;
    const totalBank = salesBank + col.bank;
    return {
      year: y, month: mo, monthName: ethMonthsAmharic[mo - 1], count,
      salesCash, salesBank, salesCredit, salesTotal, vat, profit,
      collectedCash: col.cash, collectedBank: col.bank,
      totalCash, totalBank, expenses,
      netCash: totalCash - expenses, netProfit: profit - expenses,
      bySeller,
    };
  }

  /** ዛሬ የወሩ የመጨረሻ ቀን ነው? (ወር 30 ቀን፤ ጳጉሜ 5 ወይም በዘመን መለወጫ ዓመት 6) */
  function isMonthEndToday() {
    const e = getEthDateObj();
    const last = e.month === 13 ? ((e.year % 4 === 3) ? 6 : 5) : 30;
    return e.date >= last;
  }

  /**
   * ያለፉ (የተጠናቀቁ) ወራትን ማጠቃለያ በቋሚነት ያስቀምጣል። ከአሁኑ ወር በፊት ያሉ፣
   * ገና ያልተቀመጡ እና ዳታ ያላቸው ወራት ብቻ ይዘጋሉ። አዲስ የተዘጉትን ዝርዝር ይመልሳል።
   */
  function closeFinishedMonths() {
    const cur = getEthDateObj();
    if (!DB.monthlyReports || typeof DB.monthlyReports !== "object") DB.monthlyReports = {};
    const keys = new Set();
    const add = (d) => {
      const p = parseEthDate(d);
      if (p && (p.year < cur.year || (p.year === cur.year && p.month < cur.month))) keys.add(p.year + "-" + p.month);
    };
    (DB.sales || []).forEach((s) => add(s.date));
    (DB.expenses || []).forEach((e) => add(e.date));
    allDebtPayments().forEach((p) => add(p.date));
    const closed = [];
    keys.forEach((k) => {
      if (DB.monthlyReports[k]) return;
      const parts = k.split("-").map(Number);
      const r = computeMonth(parts[0], parts[1]);
      r.closedAt = new Date().toISOString();
      DB.monthlyReports[k] = r;
      closed.push(r);
    });
    if (closed.length) SBM.database.save("monthlyReports");
    return closed;
  }

  function getMonthSummary(y, mo) {
    const saved = (DB.monthlyReports || {})[y + "-" + mo];
    if (saved) return Object.assign({ archived: true }, saved);
    return Object.assign({ archived: false }, computeMonth(y, mo));
  }

  function renderMonthlyReportUI() {
    const cur = getEthDateObj();
    let mSel = "", ySel = "";
    ethMonthsAmharic.forEach((mm, idx) => { mSel += `<option value="${idx + 1}"${(idx + 1) === cur.month ? " selected" : ""}>${mm}</option>`; });
    for (let y = cur.year - 2; y <= cur.year; y++) { ySel += `<option value="${y}"${y === cur.year ? " selected" : ""}>${y}</option>`; }
    const saved = Object.keys(DB.monthlyReports || {}).map((k) => DB.monthlyReports[k])
      .sort((a, b) => (b.year * 20 + b.month) - (a.year * 20 + a.month));
    const archiveRows = saved.length === 0
      ? '<tr><td colspan="4" style="text-align:center;">ገና የተዘጋ ወር የለም</td></tr>'
      : saved.map((r) => `<tr onclick="SBM.report.showMonth(${r.year},${r.month})" style="cursor:pointer;">
          <td><b>${escapeHTML(r.monthName)} ${r.year}</b></td>
          <td>💵 ${Number(r.totalCash || 0).toFixed(2)}</td><td>🏦 ${Number(r.totalBank || 0).toFixed(2)}</td>
          <td><b style="color:${remColor(Number(r.totalCash || 0) + Number(r.totalBank || 0) - Number(r.expenses || 0))};">${(Number(r.totalCash || 0) + Number(r.totalBank || 0) - Number(r.expenses || 0)).toFixed(2)}</b></td></tr>`).join("");
    return `<div class="form-group"><label>የሪፖርት ወር (የኢትዮጵያ ካላንደር)</label>
      <div class="eth-date-picker"><select id="mrMonth" onchange="SBM.report.updateMonthlyReport()">${mSel}</select><select id="mrYear" onchange="SBM.report.updateMonthlyReport()">${ySel}</select></div></div>
      <div id="monthlyReportBox"></div>
      <h4 style="margin-top:14px;">🗂️ የተዘጉ ወራት (ተቀምጠዋል)</h4>
      <p style="font-size:12px;color:var(--secondary);margin-bottom:6px;">ወር ሲያልቅ ማጠቃለያው በራሱ ይቀመጣል፤ የሽያጭ ታሪክ ቢጸዳም እዚህ ይቆያል። ወሩን ነካ አድርገው ዝርዝሩን ያያሉ።</p>
      <div style="max-height:180px;overflow-y:auto;"><table><thead><tr><th>ወር</th><th>በካሽ የገባ</th><th>በባንክ የገባ</th><th>ከወጪ በኋላ ቀሪ</th></tr></thead><tbody>${archiveRows}</tbody></table></div>`;
  }

  function showMonth(y, mo) {
    const mEl = document.getElementById("mrMonth"), yEl = document.getElementById("mrYear");
    if (!mEl || !yEl) return;
    if (![...yEl.options].some((o) => parseInt(o.value, 10) === y)) {
      const o = document.createElement("option"); o.value = String(y); o.textContent = String(y); yEl.appendChild(o);
    }
    mEl.value = String(mo); yEl.value = String(y);
    updateMonthlyReport();
  }

  function updateMonthlyReport() {
    const mEl = document.getElementById("mrMonth"), yEl = document.getElementById("mrYear"), box = document.getElementById("monthlyReportBox");

      ? '<span style="color:green;font-weight:bold;">✅ የተዘጋ ወር (ተቀምጧል)</span>'
      : (isCurrent ? '<span style="color:orange;font-weight:bold;">⏳ ወሩ ገና አላለቀም (እስካሁን ያለው)</span>' : '<span style="color:var(--secondary);">ለዚህ ወር የተቀመጠ መዝገብ የለም (ከአሁኑ ዳታ የተሰላ)</span>');

      : names.map((n) => { const x = r.bySeller[n]; return `<tr><td><b>👤 ${escapeHTML(n)}</b></td><td>${x.count}</td><td>${Number(x.total).toFixed(2)} ETB<br><small>ካሽ ${Number(x.cash).toFixed(2)} · ባንክ ${Number(x.bank).toFixed(2)} · ዱቤ ${Number(x.credit).toFixed(2)}</small></td></tr>`; }).join("");
    box.innerHTML = `<div style="background:rgba(0,0,0,.03);padding:12px;border-radius:10px;">
      <h4 style="margin-top:0;text-align:center;">📆 ${escapeHTML(ethMonthsAmharic[m - 1])} ${y} ዓ.ም — ወርሃዊ ሪፖርት</h4>
      <p style="text-align:center;font-size:12px;margin-bottom:8px;">${badge}</p>
      ${sumRow("💵 በካሽ የተሸጠ (ከቫት ጋር):", r.salesCash, "green")}
      ${sumRow("🏦 በባንክ የገባ (ሽያጭ):", r.salesBank, "#0A5EB0")}
      ${sumRow("💳 በዱቤ የተሸጠ:", r.salesCredit, "red")}
      ${sumRow("📥 ከዱቤ የተሰበሰበ በካሽ:", r.collectedCash, "green")}
      ${sumRow("📥 ከዱቤ የተሰበሰበ በባንክ:", r.collectedBank, "#0A5EB0")}
      <hr style="margin:8px 0;">
      ${sumRow("💰 ጠቅላላ በካሽ የገባ (ሽያጭ + የተሰበሰበ ዱቤ):", r.totalCash, "green", true)}
      ${sumRow("🏦 ጠቅላላ በባንክ የገባ (ሽያጭ + የተሰበሰበ ዱቤ):", r.totalBank, "#0A5EB0", true)}
      ${sumRow("💰 ጠቅላላ የገባ (ካሽ + ባንክ):", Number(r.totalCash) + Number(r.totalBank), "#28a745", true)}
      <hr style="margin:8px 0;">
      ${sumRow("🛒 ጠቅላላ ሽያጭ (" + r.count + " ሽያጮች):", r.salesTotal, "inherit")}
      ${(DB.vatEnabled || r.vat > 0) ? sumRow("🧾 የተሰበሰበ 15% ቫት:", r.vat, "#0A5EB0") : ""}
      ${sumRow("💸 ጠቅላላ ወጪ:", r.expenses, "orange")}
      ${profitRow("📈 የተጣራ ትርፍ (ከወጪ በኋላ):", "📉 ኪሳራ (ከወጪ በኋላ):", r.netProfit)}
      ${sumRow("💵 የተጣራ ካሽ (ከወጪ በኋላ):", r.netCash, "#0A5EB0")}
      ${sumRow("✅ ከወጪ በኋላ የቀረ ጠቅላላ (ካሽ + ባንክ − ወጪ):", Number(r.totalCash) + Number(r.totalBank) - Number(r.expenses), remColor(Number(r.totalCash) + Number(r.totalBank) - Number(r.expenses)), true)}
      </div>
      <h4 style="margin-top:12px;">👥 በሻጭ</h4>
      <div style="max-height:160px;overflow-y:auto;"><table><thead><tr><th>ሻጭ</th><th>ብዛት</th><th>ጠቅላላ</th></tr></thead><tbody>${sellerRows}</tbody></table></div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn-secondary" style="flex:1;" onclick="SBM.app.printModalContent()">🖨️ አትም</button>
        <button class="btn-primary" style="flex:1;" onclick="SBM.app.shareCurrentPage()">📤 ሼር</button>
      </div>`;
  }

  // ---------- Sales history ----------
  function renderSalesHistoryUI() {
    return `<div style="margin-bottom:10px;"><select id="salesFilterSelect" onchange="SBM.report.filterSalesHistory(this.value)" style="width:100%;padding:8px;font-weight:bold;">
      <option value="all">ሁሉንም ሽያጮች አሳይ</option><option value="cash">💵 በካሽ ብቻ</option><option value="bank">🏦 በባንክ ብቻ</option><option value="credit">💳 በዱቤ ሽያጭ</option><option value="mixed">🌗 የተቀላቀለ</option>
      </select></div>
      <div style="max-height:300px;overflow-y:auto;"><table><thead><tr><th>ቀን</th><th>የደንበኛ/ሁኔታ</th><th>የተሸጡ ዕቃዎች</th><th>ጠቅላላ (ከቫት ጋር)</th><th></th></tr></thead>
      <tbody id="salesHistoryTableBody">${generateSalesHistoryRows(DB.sales || [])}</tbody></table></div>`;
  }
  function generateSalesHistoryRows(list) {
    if (!list || list.length === 0) return '<tr><td colspan="5" style="text-align:center;">ምንም የተመዘገበ የሽያጭ ታሪክ የለም</td></tr>';
    return list.slice().reverse().map((s) => {
      let tag = s.payMode === "cash" ? '<span style="color:green;font-weight:bold;">[ካሽ]</span>'
        : s.payMode === "bank" ? '<span style="color:#0A5EB0;font-weight:bold;">[ባንክ]</span>'
        : s.payMode === "credit" ? '<span style="color:red;font-weight:bold;">[ዱቤ]</span>'
        : '<span style="color:orange;font-weight:bold;">[የተቀላቀለ]</span>';
      if (s.payMode === "mixed" || s.payMode === "partial") {
        const pp = saleParts(s);
        tag += `<br><small>ካሽ ${pp.cash.toFixed(2)} · ባንክ ${pp.bank.toFixed(2)} · ዱቤ ${pp.credit.toFixed(2)}</small>`;
      } else if (s.payMode === "bank" && !(s.bankName || s.bankRef)) {
        tag += "";
      }
      if ((s.bankName || s.bankRef) && Number(s.bankAmount || 0) > 0) {
        tag += `<br><small>🏦 ${escapeHTML(s.bankName || "")}${s.bankRef ? " · " + escapeHTML(s.bankRef) : ""}</small>`;
      }
      if (s.belowCost) tag += `<br><small style="color:#dc3545;font-weight:bold;">⚠️ ከመግዣ በታች የተሸጠ (ኪሳራ ${Number(s.lossAmount || 0).toFixed(2)})</small>`;
      const tv = s.total !== undefined ? s.total : (s.subtotal ? s.subtotal * 1.15 : 0);
      return `<tr><td><small>${escapeHTML(s.date)}</small></td><td><b>${escapeHTML(s.customer)}</b>${s.seller ? "<br><small>👤 " + escapeHTML(s.seller) + "</small>" : ""}<br>${tag}</td>
        <td><small>${escapeHTML(s.summaryName)}</small></td><td><b>${Number(tv).toFixed(2)} ETB</b></td>
        <td>${(!SBM.auth.isAdmin() && saleAgeDays(s) > RETURN_DAYS_LIMIT) ? '<small>🔒 አድሚን</small>' : `<button class="btn-danger" style="padding:4px 8px;font-size:12px;" onclick="SBM.report.returnSale(${Number(s.id)})">↩️ ተመለሰ</button>`}</td></tr>`;
    }).join("");
  }

  function renderAlertsUI() {
    const list = (DB.alerts || []).slice().reverse();
    const unread = list.filter((a) => !a.read).length;
    const icon = (t) => (t === "belowCost" ? "⚠️" : t === "return" ? "↩️" : t === "expense" ? "💸" : t === "stock" ? "📦" : t === "stockReq" ? "📥" : "🔔");
    const rows = list.length === 0
      ? '<tr><td colspan="2" style="text-align:center;">ምንም ማሳወቂያ የለም</td></tr>'
      : list.map((a) => `<tr style="${a.read ? "opacity:.6;" : "font-weight:600;"}"><td><small>${escapeHTML(a.date)}</small><br><small>👤 ${escapeHTML(a.by || "")}</small></td>
        <td>${icon(a.type)} ${escapeHTML(a.text || "")}${a.amount ? "<br><b>" + Number(a.amount).toFixed(2) + " ETB</b>" : ""}${a.read ? "" : ' <span class="overdue-badge">አዲስ</span>'}</td></tr>`).join("");
    return `<div class="summary-box"><b>${unread} ያልተነበበ ማሳወቂያ</b></div>
      <button class="btn-secondary" style="width:100%;padding:8px;margin-bottom:10px;" onclick="SBM.report.markAllAlertsRead()">✔ ሁሉንም እንደተነበበ ምልክት አድርግ</button>
      <div style="max-height:360px;overflow-y:auto;"><table><thead><tr><th>መቼ/ማን</th><th>ዝርዝር</th></tr></thead><tbody>${rows}</tbody></table></div>`;

  function markAllAlertsRead() {
    if (!SBM.utils.requireAdmin()) return;

    SBM.database.save("alerts");
    SBM.app.renderDashboardMenu();
    SBM.app.openPage("alerts");
  }

  const RETURN_DAYS_LIMIT = 3;
  function saleAgeDays(s) {
    const t = Number(s.id);
    return t > 0 ? (Date.now() - t) / 86400000 : 0;
  }
  function renderReturnsLogUI() {
    const list = (DB.returns || []).slice().reverse();
    const total = list.reduce((a, r) => a + Number(r.amount || 0), 0);
    const rows = list.length === 0
      ? '<tr><td colspan="4" style="text-align:center;">ምንም የተመላሽ መዝገብ የለም</td></tr>'
      : list.map((r) => `<tr><td><small>${escapeHTML(r.date)}</small><br><small>👤 ${escapeHTML(r.by || "")}${r.role === "admin" ? " (አድሚን)" : ""}</small></td>
        <td><b>${escapeHTML(r.customer || "")}</b><br><small>የሽያጭ ቀን፡ ${escapeHTML(r.saleDate || "")}</small></td>
        <td><small>${escapeHTML(r.items || "")}</small>${r.creditReduced > 0 ? "<br><small>💳 ዕዳ ቀንሷል " + Number(r.creditReduced).toFixed(2) + "</small>" : ""}</td>
        <td><b>${Number(r.amount || 0).toFixed(2)}</b><br><small>${r.full ? "ሙሉ" : "ከፊል"}</small></td></tr>`).join("");
    return `<div class="summary-box"><b>ጠቅላላ የተመለሰ፦ ${total.toFixed(2)} ETB</b> (${list.length} መዝገብ)</div>
      <div style="max-height:380px;overflow-y:auto;"><table><thead><tr><th>መቼ/ማን</th><th>ደንበኛ</th><th>የተመለሰ እቃ</th><th>ብር</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  /** የተመለሰ እቃ፦ ከሽያጭ ውስጥ አንድ መስመር (ወይም ሁሉንም) ይሰርዛል፣ እቃውን ወደ ስቶክ ይመልሳል፣ የዱቤ ክፍል ካለ ከደንበኛው ዕዳ ይቀንሳል። */
  function returnSale(id) {
    if (!SBM.auth || !SBM.auth.getSession()) return;
    const sale = (DB.sales || []).find((x) => Number(x.id) === Number(id));
    if (!sale) return;
    if (!SBM.auth.isAdmin() && saleAgeDays(sale) > RETURN_DAYS_LIMIT) {
      return alert("ይህ ሽያጭ ከ" + RETURN_DAYS_LIMIT + " ቀን በላይ ሆኖታል። ተመላሽ ማስተካከል የሚችለው አድሚን ብቻ ነው።");
    }
    const items = sale.items || [];
    if (items.length === 0) return;
    const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
    const EPS = 1e-6;

    // ---- የትኛው እቃ? ----
    let lineIdxs;
    if (items.length === 1) lineIdxs = [0];
    else {
      const list = items.map((c, i) => (i + 1) + ". " + c.name + " (" + c.displayQty + " " + (c.displayUnit || "") + ")").join("\n");
      const ans = prompt("የትኛው እቃ ተመለሰ? ቁጥሩን ያስገቡ (ሁሉንም ሽያጭ ለመመለስ 0)፡\n\n" + list, "1");
      if (ans === null) return;
      const n = parseInt(ans, 10);
      if (isNaN(n) || n < 0 || n > items.length) return alert("ትክክለኛ ቁጥር ያስገቡ!");
      lineIdxs = n === 0 ? items.map((_, i) => i) : [n - 1];
    }

    // ---- ምን ያህል? (በማንኛውም አሃድ፦ ኩንታል/ኪሎ፣ ካርቶን/ፍሬ፣ ደርዘን/ፍሬ፣ ካሳ/ፍሬ፣ ጥቅል/ሜትር፣ ጀሪካን/ሊትር) ----
    const plan = [];
    for (const idx of lineIdxs) {
      const c = items[idx];
      const si = (DB.stock || []).find((x) => x.id === c.id);
      const small = (si && si.unit) || "ፍሬ";
      const bulk = si && si.bulkUnit && (Number(si.bulkConversion) || 1) > 1 ? si.bulkUnit : null;
      const conv = bulk ? Number(si.bulkConversion) : 1;
      if (lineIdxs.length > 1 && lineIdxs.length === items.length) {
        plan.push({ idx, rq: Number(c.qty), shown: c.displayQty, unitLabel: c.displayUnit || small }); // ሁሉንም ሽያጭ መመለስ
        continue;
      }
      let useBulk = false;
      if (bulk) {
        const soldBulk = (c.displayUnit || "") === bulk;
        const u = prompt("በየትኛው አሃድ ይመልሳሉ?\n1 = " + bulk + "\n2 = " + small, soldBulk ? "1" : "2");
        if (u === null) return;
        if (u.trim() !== "1" && u.trim() !== "2") return alert("1 ወይም 2 ያስገቡ!");
        useBulk = u.trim() === "1";
      }
      const unitLabel = useBulk ? bulk : small;
      const factor = useBulk ? conv : 1;
      const fullInUnit = r2(Number(c.qty) / factor);
      const qStr = prompt("ስንት " + unitLabel + " ተመለሰ?\n(" + c.name + "፦ ከተሸጠው " + c.displayQty + " " + (c.displayUnit || "") + " ውስጥ፤ ጠቅላላው በ" + unitLabel + " = " + fullInUnit + ")", String(fullInUnit));
      if (qStr === null) return;
      const q = parseFloat(qStr);
      if (isNaN(q) || q <= 0) return alert("ትክክለኛ ብዛት ያስገቡ!");
      const rq = q * factor;
      if (rq > Number(c.qty) + EPS) return alert("ከተሸጠው በላይ መመለስ አይቻልም! (ከፍተኛ፦ " + fullInUnit + " " + unitLabel + ")");
      plan.push({ idx, rq: Math.min(rq, Number(c.qty)), shown: q, unitLabel });
    }
    if (plan.length === 0) return;

    // ---- ስሌት ----
    const vatRate = sale.vatApplied === false ? 0 : (Number(sale.subtotal) > 0 ? Number(sale.vatAmount || 0) / Number(sale.subtotal) : 0);
    plan.forEach((pl) => {
      const c = items[pl.idx];
      pl.r = Math.min(1, pl.rq / Number(c.qty));
      pl.full = pl.r >= 1 - EPS;
      pl.sub = Number(c.subtotal || 0) * pl.r;
      pl.prof = Number(c.profit || 0) * pl.r;
      pl.buy = Number(c.qty) > 0 ? Math.max(0, (Number(c.sellPrice) * Number(c.qty) - Number(c.profit || 0)) / Number(c.qty)) : 0;
    });
    const retSub = plan.reduce((a, p) => a + p.sub, 0);
    const retVat = retSub * vatRate;
    const retTotal = retSub + retVat;
    const retProfit = plan.reduce((a, p) => a + p.prof, 0);
    const oldTotal = Number(sale.total || 0);
    const wholeSale = plan.length === items.length && plan.every((p) => p.full);
    const ratio = wholeSale || oldTotal <= 0 ? 1 : Math.min(1, retTotal / oldTotal);

    // 1) እቃውን ወደ ስቶክ መመለስ (በትንሹ አሃድ)
    plan.forEach((pl) => {
      const c = items[pl.idx];
      const si = (DB.stock || []).find((x) => x.id === c.id);
      if (!si) return;
      si.qty = (Number(si.qty) || 0) + pl.rq;
      if (!si.batches) si.batches = [];
      si.batches.unshift({ qty: pl.rq, buyPrice: pl.buy });
    });

    // 2) ዱቤ ካለ ከደንበኛው ዕዳ መቀነስ
    const credit = Number(sale.creditAmount || 0);
    const creditCut = Math.round(credit * ratio * 100) / 100;
    const desc = plan.map((p) => items[p.idx].name + " (x" + p.shown + " " + p.unitLabel + ")").join(", ");
    if (creditCut > 0 && sale.customer && SBM.credit) {
      SBM.credit.recordTransaction(sale.customer, "እቃ መለሰ", desc, -creditCut, 0, "");
    }

    // 3) ሽያጩን ማስተካከል ወይም መሰረዝ
    if (wholeSale) {
      DB.sales = DB.sales.filter((x) => Number(x.id) !== Number(id));
    } else {
      plan.forEach((pl) => {
        const c = items[pl.idx];
        if (pl.full) return;
        const newQty = Number(c.qty) - pl.rq;
        const small = ((DB.stock || []).find((x) => x.id === c.id) || {}).unit || "ፍሬ";
        const cf = Number(c.convFactor) || 1;
        c.subtotal = r2(Number(c.subtotal) - pl.sub);
        c.profit = r2(Number(c.profit || 0) - pl.prof);
        c.qty = newQty;
        const inSold = newQty / cf;
        if (cf > 1 && Math.abs(inSold - Math.round(inSold)) > 1e-6) {
          // ከጅምላ አሃድ ሙሉ ቁጥር ካልወጣ (ምሳሌ፦ 9 ፍሬ ከደርዘን) በትንሹ አሃድ ያሳያል
          c.displayUnit = small; c.displayQty = r2(newQty); c.displaySellPrice = c.sellPrice; c.convFactor = 1;
        } else {
          c.displayQty = r2(inSold);
        }
      });
      sale.items = items.filter((_, i) => !plan.some((p) => p.idx === i && p.full));
      sale.subtotal = r2(Number(sale.subtotal) - retSub);
      sale.vatAmount = r2(Number(sale.vatAmount || 0) - retVat);
      sale.total = r2(oldTotal - retTotal);
      sale.profit = r2(Number(sale.profit || 0) - retProfit);
      sale.cashAmount = r2(Number(sale.cashAmount || 0) * (1 - ratio));
      sale.bankAmount = r2(Number(sale.bankAmount || 0) * (1 - ratio));
      sale.creditAmount = r2(credit - creditCut);
      sale.summaryName = sale.items.map((c) => c.name + " (x" + c.displayQty + (c.displayUnit || "") + " @ " + c.displaySellPrice + "ብር)").join(", ");
    }
    if (!Array.isArray(DB.returns)) DB.returns = [];
    DB.returns.push({
      id: Date.now(), date: getEthDateStr(), saleId: sale.id, saleDate: sale.date, customer: sale.customer || "",
      items: desc, amount: r2(retTotal), creditReduced: creditCut, full: wholeSale,
      by: SBM.auth.currentName(), role: SBM.auth.isAdmin() ? "admin" : "staff",
    });
    SBM.app.addAlert("return", "የተመለሰ እቃ መዘገበ፦ " + desc + " — ደንበኛ፡ " + (sale.customer || ""), retTotal);
    SBM.database.save("returns");
    SBM.database.save("stock");
    SBM.database.save("sales");
    showToast("እቃው ተመልሷል፤ ስቶክ ተስተካክሏል ✅");
    SBM.app.openPage("salesHistory");
  }

    showToast(DB.vatEnabled ? "ቫት ነቅቷል!" : "ቫት ጠፍቷል! POS ከአሁን ጀምሮ ያለ ቫት ይሸጣል");
  }

  function saveCompanyName() {
    if (!SBM.utils.requireAdmin()) return;
    const c = (document.getElementById("cfgComp").value || "").trim();
    if (!c) return alert("እባክዎን ትክክለኛ የድርጅት ስም ያስገቡ!");
    DB.companyName = c;
    SBM.database.save("companyName");
    document.getElementById("headerCompName").innerText = DB.companyName;
    showToast("የድርጅት ስም ተቀይሯል!");
  }

  async function changePin() {
    if (!SBM.utils.requireAdmin()) return;
    const oldPin = (document.getElementById("cfgOldPin").value || "").trim();
    const newPin = (document.getElementById("cfgNewPin").value || "").trim();
    if (!oldPin || !newPin) return alert("እባክዎን ሁለቱንም ፒኖች ያስገቡ!");
    if (newPin.length < 4) return alert("አዲሱ ፒን ቢያንስ 4 አሃዝ ሊሆን ይገባል!");
    const result = await SBM.auth.changePin(oldPin, newPin);
    if (!result.ok && result.reason === "pin-in-use") return alert("ይህ ፒን በአንድ ሰራተኛ ተይዟል! ሌላ ፒን ይምረጡ።");
    if (!result.ok) return alert("የአሁኑ ፒን ትክክል አይደለም!");
    alert("✅ ፒን ተቀይሯል!\n\n📝 አዲስ የመልሶ ማግኛ ኮድ (Recovery Code)፦\n\n" + result.recoveryCode + "\n\nይህንን ኮድ በወረቀት ላይ ጽፈው በጥንቃቄ ያስቀምጡ — ፒንዎን ቢረሱ ብቻ የሚያስፈልግዎ ነው፣ ዳግም አይታይም!");
    document.getElementById("cfgOldPin").value = "";
    document.getElementById("cfgNewPin").value = "";
    showToast("ፒን ተቀይሯል!");
  }

  global.SBM = global.SBM || {};
  const staffErrors = {
    "no-name": "እባክዎን የሰራተኛውን ስም ያስገቡ!",
    "short-pin": "ፒኑ ቢያንስ 4 አሃዝ ሊሆን ይገባል!",
    "dup-name": "ይህ ስም አስቀድሞ ተመዝግቧል!",
    "pin-in-use": "ይህ ፒን አስቀድሞ ተይዟል! ሌላ ፒን ይምረጡ።",
    "not-found": "ሰራተኛው አልተገኘም!",
  };

  async function addStaff() {
    if (!SBM.utils.requireAdmin()) return;
    const name = (document.getElementById("cfgStaffName").value || "").trim();
    const pin = (document.getElementById("cfgStaffPin").value || "").trim();
    const r = await SBM.auth.addStaff(name, pin);
    if (!r.ok) return alert(staffErrors[r.reason] || "መመዝገብ አልተቻለም!");
    showToast("ሰራተኛው ተመዝግቧል! ✅");
    SBM.app.openPage("settings");
  }

  async function resetStaffPin(id) {
    if (!SBM.utils.requireAdmin()) return;
    const np = prompt("አዲስ ፒን ያስገቡ (ቢያንስ 4 አሃዝ)፡");
    if (np === null) return;
    const r = await SBM.auth.resetStaffPin(id, np);
    if (!r.ok) return alert(staffErrors[r.reason] || "መቀየር አልተቻለም!");
    showToast("የሰራተኛው ፒን ተቀይሯል! ✅");
  }

  function removeStaff(id) {
    if (!SBM.utils.requireAdmin()) return;
    if (!confirm("እርግጠኛ ነዎት ይህ ሰራተኛ ይሰረዝ? (ያደረጋቸው ሽያጮች በሪፖርት ውስጥ ይቆያሉ)")) return;
    SBM.auth.removeStaff(id);
    showToast("ሰራተኛው ተሰርዟል!");
    SBM.app.openPage("settings");
  }

  global.SBM.settings = { renderUI, saveCompanyName, toggleVat, changePin, addStaff, resetStaffPin, removeStaff };
})(window);

</script>

<script>
// ኢንተርኔት ሳይኖር መተግበሪያው እንዲከፈት (Service Worker)።
// በ https ድረ ገጽ ላይ ብቻ ይነቃል፤ በ Acode preview (localhost) እና በፋይል አይነቃም።
(function () {
  try {
    var h = location.hostname;
    if ('serviceWorker' in navigator && location.protocol === 'https:' && h !== 'localhost' && h !== '127.0.0.1') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  } catch (e) {}
})();
</script>
